/**
 * Joue la séquence. L'état final est déjà correct dans le DOM avant
 * l'animation : un lecteur d'écran lit toujours le bon score, et un tap
 * à n'importe quel instant saute directement à la fin.
 */
function jouerDevoilement(){
  const l = byId(S.leads, S.devoile);
  const el = document.getElementById("dev-nombre");
  if (!l || !el) return;

  const arc = document.getElementById("dev-arc");
  const verdict = document.getElementById("dev-verdict");
  const ligne = document.getElementById("dev-ligne");
  const manque = document.getElementById("dev-manque");
  const seuilEl = document.getElementById("dev-seuil");
  const CIRC = 490.1;
  const S0 = l.score;

  // `couper` et `fin` se referencent mutuellement : on declare la variable
  // avant de l affecter, sinon le chemin « mouvement reduit » appelle fin()
  // alors que couper est encore dans sa zone morte temporelle.
  let annule = false;
  let couper = null;
  let fin = function(){
    el.textContent = String(S0);
    if (arc) arc.style.strokeDashoffset = String(CIRC * (1 - S0 / 100));
    [verdict, ligne, manque, seuilEl].forEach(function(x){ if (x) x.style.opacity = "1"; });
    if (couper) document.removeEventListener("pointerdown", couper, true);
  };
  couper = function(){ annule = true; fin(); };

  if (MOUVEMENT_REDUIT) { fin(); return; }
  document.addEventListener("pointerdown", couper, true);

  // Filet de securite : dans un onglet en arriere-plan, requestAnimationFrame
  // est suspendu. Sans ce garde-fou, le commercial retrouverait un ecran fige
  // sur zero en revenant. Au-dela de 1,4 s, on saute a l etat final.
  const secours = setTimeout(function(){ if (!annule) { annule = true; fin(); } }, 1400);
  const finAvecSecours = fin;
  fin = function(){ clearTimeout(secours); finAvecSecours(); };

  // Arrêt de frontière : uniquement si le score est réellement à portée
  // du seuil, et jamais deux fois de suite.
  const seuil = SEUILS_BANDE.filter(function(x){ return Math.abs(S0 - x) <= 3; })[0];
  const suspend = (seuil && !S.suspensionPrecedente) ? seuil - 1 : null;
  S.suspensionPrecedente = !!suspend;

  const t0 = performance.now();
  const DUREE = 420;          // 120 → 540 dans la spécification
  const majAffichage = function(v){
    el.textContent = String(Math.round(v));
    if (arc) arc.style.strokeDashoffset = String(CIRC * (1 - v / 100));
  };

  // Courbe dissymétrique : 70 % de la valeur en 250 ms, 30 % étirés sur 170 ms.
  const courbe = function(p){
    return p <= 0.595 ? 0.70 * (p / 0.595) : 0.70 + 0.30 * ((p - 0.595) / 0.405);
  };

  let suspendu = false, tSuspend = 0;
  (function pas(t){
    if (annule) return;
    let e = t - t0;
    if (suspendu) {
      if (t - tSuspend < 260) { requestAnimationFrame(pas); return; }
      suspendu = false;
      // on repart de la suspension vers la valeur réelle, sur 200 ms
      const t1 = performance.now();
      (function fini(u){
        if (annule) return;
        const q = Math.min(1, (u - t1) / 200);
        majAffichage(suspend + (S0 - suspend) * easeSortie(q));
        if (q < 1) requestAnimationFrame(fini); else suite();
      })(t1);
      return;
    }
    const p = Math.min(1, e / DUREE);
    const v = courbe(p) * S0;
    if (suspend !== null && v >= suspend && Math.round(v) >= suspend) {
      majAffichage(suspend); suspendu = true; tSuspend = t;
      requestAnimationFrame(pas); return;
    }
    majAffichage(v);
    if (p < 1) requestAnimationFrame(pas); else suite();
  })(t0);

  function suite(){
    if (annule) return;
    majAffichage(S0);
    // LE FILET D ACTE — le depassement porte sur l AIGUILLE, jamais sur le
    // nombre : la specification dopamine interdit formellement d afficher
    // une valeur superieure au score final, sinon le score perd sa credibilite.
    // L arc, lui, est un objet graphique : il peut avoir l inertie d une aiguille.
    if (arc && !MOUVEMENT_REDUIT) {
      const dep = Math.min(100, S0 + 3);
      arc.style.transition = "stroke-dashoffset 180ms " + "cubic-bezier(.22,1,.36,1)";
      arc.style.strokeDashoffset = String(CIRC * (1 - dep / 100));
      setTimeout(function(){
        if (annule || !arc) return;
        arc.style.transition = "stroke-dashoffset 260ms cubic-bezier(.22,1,.36,1)";
        arc.style.strokeDashoffset = String(CIRC * (1 - S0 / 100));
      }, 180);
    }
    // le filet se trace sous le score, puis vire au gris et RESTE grave
    const acte = document.getElementById("dev-acte");
    if (acte) setTimeout(function(){ acte.classList.add("trace"); }, 120);
    if (seuilEl) { seuilEl.style.transition = "opacity .2s"; seuilEl.style.opacity = "1"; }
    try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
    setTimeout(function(){
      if (annule || !verdict) return;
      verdict.style.transition = "opacity .12s";
      verdict.style.opacity = "1";
      verdict.classList.add("bc-pop");
    }, 0);
    setTimeout(function(){
      if (annule) return;
      if (ligne) { ligne.style.transition = "opacity .2s, transform .2s"; ligne.style.opacity = "1"; }
      if (manque) { manque.style.transition = "opacity .25s"; manque.style.opacity = "1"; }
      document.removeEventListener("pointerdown", couper, true);
    }, 140);
  }
}

/* ============================================================
   Composants graphiques (SVG maison, aucune dépendance)
   ============================================================ */
function grouper(rows, cle){
  const m = new Map();
  rows.forEach(function(r){
    // Un champ non renseigne est une information, pas un trou : on le nomme
    // au lieu de dessiner une barre sans etiquette.
    const v = (r[cle] == null || String(r[cle]).trim() === "") ? "Non renseigne\u0301" : r[cle];
    m.set(v, (m.get(v) || 0) + 1);
  });
  return [...m.entries()].map(function(e){ return { label:e[0], value:e[1] }; })
    .sort(function(a,b){ return b.value - a.value; });
}
const NON_RENSEIGNE = "Non renseigne\u0301";

function barChart(titre, hint, data, couleur, max){
  const m = max || Math.max.apply(null, data.map(function(d){ return d.value; }).concat([1]));
  const total = data.reduce(function(s,d){ return s + d.value; }, 0);
  return '<section class="chart"><h3>' + esc(titre) + '</h3>' +
    (hint ? '<p class="hint">' + esc(hint) + '</p>' : "") +
    '<div class="body"><div class="bars">' +
      data.map(function(d){
        return '<div class="barrow">' +
          '<span class="lb" title="' + esc(d.label) + '">' + esc(d.label) + '</span>' +
          '<span class="bartrack"><i class="barfill" style="width:' + (d.value/m*100) + '%;background:' +
            (d.label === NON_RENSEIGNE ? "var(--ink-4)" : (couleur || "var(--accent)")) + '"></i></span>' +
          '<span class="vv num">' + d.value + '</span></div>';
      }).join("") +
    '</div>' +
    '<p class="hint" style="margin-top:12px">' + total + ' leads répartis sur ' + data.length + ' valeurs</p>' +
    '</div></section>';
}

function areaChart(titre, hint, points){
  const W = 460, H = 150, PB = 26, PL = 30;
  const max = Math.max.apply(null, points.map(function(p){ return p.value; }).concat([1]));
  const step = (W - PL - 10) / Math.max(points.length - 1, 1);
  const xy = points.map(function(p, i){
    return [PL + i*step, H - PB - (p.value/max) * (H - PB - 14)];
  });
  const ligne = xy.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  const aire = ligne + " L" + xy[xy.length-1][0].toFixed(1) + " " + (H-PB) + " L" + xy[0][0].toFixed(1) + " " + (H-PB) + " Z";
  return '<section class="chart"><h3>' + esc(titre) + '</h3>' +
    (hint ? '<p class="hint">' + esc(hint) + '</p>' : "") +
    '<div class="body"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="150" role="img" ' +
      'aria-label="' + esc(titre + " : " + points.map(function(p){ return p.label + " " + p.value; }).join(", ")) + '">' +
      [0,.5,1].map(function(f){
        const y = 14 + f*(H-PB-14);
        return '<line x1="' + PL + '" x2="' + (W-10) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>' +
          '<text x="' + (PL-7) + '" y="' + (y+3.5) + '" text-anchor="end" font-size="9.5" fill="var(--ink-4)">' +
          Math.round(max*(1-f)) + '</text>';
      }).join("") +
      '<path d="' + aire + '" fill="var(--accent)" opacity=".10"/>' +
      '<path d="' + ligne + '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      xy.map(function(p, i){
        return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.4" fill="#fff" stroke="var(--accent)" stroke-width="2"/>' +
          '<text x="' + p[0].toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">' +
          esc(points[i].label) + '</text>';
      }).join("") +
    '</svg></div></section>';
}

function funnelChart(titre, hint, etapes){
  const base = etapes[0].value || 1;
  return '<section class="chart"><h3>' + esc(titre) + '</h3>' +
    (hint ? '<p class="hint">' + esc(hint) + '</p>' : "") +
    '<div class="body"><div class="bars">' +
      etapes.map(function(e, i){
        const p = pct(e.value, base);
        return '<div>' +
          '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">' +
            '<span style="color:var(--ink-2)">' + esc(e.label) + '</span>' +
            '<span><b class="num">' + e.value + '</b> <span style="color:var(--ink-4)" class="num">· ' + p + ' %</span></span></div>' +
          '<div class="bartrack" style="height:22px">' +
            '<i class="barfill" style="width:' + p + '%;background:var(--accent);opacity:' +
            (1 - i*0.17).toFixed(2) + '"></i></div>' +
          (i < etapes.length-1
            ? '<div style="font-size:11px;color:var(--ink-4);margin:5px 0 3px;padding-left:2px">↓ ' +
              Math.min(100, pct(etapes[i+1].value, e.value)) + ' % des pre\u0301ce\u0301dents franchissent cette e\u0301tape</div>' : "") +
        '</div>';
      }).join("") +
    '</div></div></section>';
}

/** Entonnoir strictement emboite : chaque etape filtre la precedente.
 *  Sans cet emboitement, un entonnoir peut afficher plus de 100 % a une
 *  etape, ce qui le rend faux et decredibilise tout le tableau de bord. */
function etapesEntonnoir(L){
  const e1 = L;
  const e2 = e1.filter(emailExploitable);
  const e3 = e2.filter(qualifie);
  const e4 = e3.filter(pretCRM);
  const e5 = e4.filter(function(l){ return l.crm; });
  return [
    { label:"Contacts enregistrés", value:e1.length },
    { label:"Canal de contact valide", value:e2.length },
    { label:"Leads qualifiés", value:e3.length },
    { label:"Fiches prêtes pour le CRM", value:e4.length },
    { label:"Transmises au CRM", value:e5.length }
  ];
}

/** Legende deduite des donnees affichees, pour qu'elle ne puisse jamais
 *  contredire la courbe qu'elle commente. */
function legendeJours(pts){
  let hi = 0, lo = 0;
  pts.forEach(function(p, i){ if (p.value > pts[hi].value) hi = i; if (p.value < pts[lo].value) lo = i; });
  return "Journée la plus forte : " + pts[hi].label + " juin (" + pts[hi].value + " leads). " +
         "La plus faible : " + pts[lo].label + " juin (" + pts[lo].value + ").";
}


/** Pouls du salon : ce que l'equipe vient de faire, reconstruit a partir

function voletPouls(){

    '<div style="display:flex;align-items:center;gap:8px">' +

    '</div>' +
    '<p class="hint">Les derniers faits marquants de l’équipe, sur le stand, en ce moment.</p>' +
    '<div class="body"><div class="pouls bc-cascade">' +
      evts.map(function(e){
        return '<button type="button" class="pl bc-appui" data-open="' + esc(e.lead.id) + '" style="text-align:left;width:100%">' +
          '<span class="avatar" style="background:' + avatarColor(e.c.id) + ';width:26px;height:26px;font-size:10px">' +
            esc(e.c.init) + '</span>' +
          '<span class="pq"><b>' + esc(e.c.nom.split(" ")[0]) + '</b> ' + esc(e.quoi) + '</span>' +
          '<span class="pt">' + esc(e.quand) + '</span>' +
        '</button>';
      }).join("") +
    '</div>' +
    '<p class="hint" style="margin-top:11px">Un manager qui voit son équipe avancer en direct ouvre ' +
      'l’application dix fois par jour pendant le salon. C’est l’effet recherché.</p>' +
    '</div></section>';
}

/** La contribution de l'équipe.
 *  Tri ALPHABÉTIQUE, jamais par performance. Un classement public
 *  démotive les trois quarts d'une équipe et pousse au volume creux.
 *  La médiane sert de repère, sans désigner personne. */
function voletContribution(){
  const e = contributionEquipe();
  const max = Math.max.apply(null, e.lignes.map(function(x){ return x.contacts; }).concat([1]));
  return '<section class="chart">' +
    '<h3>Contribution de l’équipe</h3>' +
    '<p class="hint">Leads qualifiés sur contacts enregistrés. Ordre alphabétique : ce tableau ' +
      'sert à répartir la charge, pas à classer des personnes.</p>' +
    '<div class="body"><div class="bars">' +
      e.lignes.map(function(x){
        return '<div class="barrow" style="grid-template-columns:150px 1fr 96px">' +
          '<span class="lb">' + esc(x.c.nom) + '</span>' +
          '<span class="bartrack" style="position:relative">' +
            '<i class="barfill" style="width:' + (x.contacts/max*100).toFixed(0) + '%;background:var(--piste)!important"></i>' +
            '<i class="barfill" style="position:absolute;top:0;left:0;width:' + (x.qualifies/max*100).toFixed(0) + '%"></i>' +
          '</span>' +
          '<span class="vv num">' + x.qualifies + ' / ' + x.contacts + '</span></div>';
      }).join("") +
    '</div>' +
    '<p class="hint" style="margin-top:12px">Médiane de l’équipe : <b>' + e.medianeQualifies +
      '</b> leads qualifiés. Barre pleine : qualifiés. Barre claire : contacts enregistrés.</p>' +
    '</div></section>';
}

/* ============================================================
   Vue : tableau de bord manager
   ============================================================ */
function vueDashboard(){
  const L = S.leads;
  const Q = L.filter(qualifie);
  const prets = L.filter(pretCRM);
  const nonTransmis = L.filter(function(l){ return qualifie(l) && !l.crm; });
  const chauds = L.filter(function(l){ return (l.score || 0) >= 75; });
  const complets = L.filter(function(l){ return completude(l) === 1; });
  const dansCRM = L.filter(function(l){ return l.crm; });
  const delaiMed = mediane(L.map(function(l){ return l.qualifieEn; }));
  const delaiP90 = percentile(L.map(function(l){ return l.qualifieEn; }), 0.9);
  const parJour = ["2026-06-15","2026-06-16","2026-06-17","2026-06-18","2026-06-19"].map(function(d){
    return { label:dayLabel(d).replace(" juin",""), value:L.filter(function(l){ return l.date === d; }).length };
  });
  const scoreMoyen = Math.round(L.reduce(function(s,l){ return s + l.score; }, 0) / (L.length || 1));

  return '<div class="page">' +
    '<div class="pagehead">' +
      '<p class="eyebrow">Pilotage · ' + esc(SEED.salon.nom) + '</p>' +
      '<h1>Tableau de bord</h1>' +
      '<p>Ce que l’équipe a réellement ramené du salon, mis à jour à chaque capture. ' +
         'Un lead qualifié : e-mail exploitable, quatre critères renseignés, score ≥ 60, consentement recueilli.</p>' +
    '</div>' +

    '<div class="kpigrid">' +
      kpi("Contacts enregistrés", L.length, "sur les 5 jours de salon", {}) +
      kpi("Leads qualifiés", Q.length, "définition v1 — " + pct(Q.length, L.length) + " % des contacts", { qualifie:"oui" }) +
      kpi("Prêtes pour le CRM", prets.length, pct(prets.length, L.length) + " % — cible 80 %", { pret:"oui" }) +
      kpi("Non transmises au CRM", nonTransmis.length, "objectif : 0", { qualifie:"oui", crm:"non" }) +
      kpi("Délai médian de qualification", delaiMed + " min", "p90 " + delaiP90 + " min", null) +
    '</div>' +

    '<div class="chartgrid g-2" style="margin-top:14px">' +
      voletPouls() + voletContribution() +
    '</div>' +

    '<div class="chartgrid">' +
      areaChart("Leads par jour", legendeJours(parJour), parJour) +
      funnelChart("Du contact au CRM",
        "Chaque étape est un sous-ensemble strict de la précédente : le même lead est suivi de bout en bout.",
        etapesEntonnoir(L)) +
      barChart("Pays", "Top 8. Utile pour arbitrer les prochains salons.", grouper(L, "pays").slice(0,8)) +
      barChart("Profil société", "Qui vient réellement sur le stand.", grouper(L, "profil")) +
      barChart("Niveau de demande", "Le critère le plus lourd du barème : 30 sur 100.", grouper(L, "niveau"), "var(--warm)") +
      barChart("Produit d’intérêt", "Ce que le marché est venu chercher.", grouper(L, "produit")) +
      barChart("Action de suivi attendue", "La charge de travail post-salon, par nature d’action.", grouper(L, "suivi"), "var(--ok)") +
      barChart("Machine concernée", "Signal pour le bureau d’études.", grouper(L, "machine")) +
    '</div>' +
  '</div>';
}

/** Indicateur. `filtre` (objet ou null) rend la tuile actionnable :
 *  elle ouvre la liste des leads deja filtree. Une tuile sans filtre
 *  n'est pas cliquable et ne pretend pas l'etre. */
/* `aller` mene a une VUE, la ou `filtre` restreint la vue courante : un
   indicateur qui annonce un probleme doit pouvoir ouvrir l ecran qui le
   resout, sinon il ne fait que le signaler. */
function kpi(lbl, val, sub, filtre, aller){
  const actif = !!filtre || !!aller;
  return '<' + (actif ? 'button type="button"' : 'div') + ' class="kpi' + (actif ? ' kpi-clic' : '') + '"' +
    (filtre ? ' data-kpi-filtre="' + esc(JSON.stringify(filtre)) + '"' : '') +
    (aller ? ' data-go="' + esc(S.role) + '|' + esc(aller) + '|"' : '') + '>' +
    '<div class="lbl">' + esc(lbl) + (actif ? ' <span class="kpi-fleche" aria-hidden="true">→</span>' : '') + '</div>' +
    '<div class="val num">' + val + '</div>' +
    '<div class="sub">' + esc(sub) + '</div>' +
    '</' + (actif ? 'button' : 'div') + '>';
}

/* ============================================================
   Vue : liste des leads
   ============================================================ */
function leadsFiltres(){
  const q = S.q.trim().toLowerCase();
  return S.leads.filter(function(l){
    if (S.f.statut && l.statut !== S.f.statut) return false;
    if (S.f.commercial && l.commercial !== S.f.commercial) return false;
    if (S.f.pays && l.pays !== S.f.pays) return false;
    if (S.f.crm === "oui" && !l.crm) return false;
    if (S.f.crm === "non" && l.crm) return false;
    if (S.f.complet === "oui" && completude(l) !== 1) return false;
    if (S.f.complet === "non" && completude(l) === 1) return false;
    if (S.f.jour && l.date !== S.f.jour) return false;
    if (!q) return true;
    return (l.prenom + " " + l.nom + " " + l.societe + " " + l.email + " " + l.pays + " " + l.fonction)
      .toLowerCase().indexOf(q) >= 0;
  }).sort(function(a,b){
    const k = S.sort.k;
    let va = a[k], vb = b[k];
    if (k === "nom") { va = a.nom + a.prenom; vb = b.nom + b.prenom; }
    if (va < vb) return -S.sort.dir;
    if (va > vb) return S.sort.dir;
    return 0;
  });
}

/* ============================================================
   Le Carnet — « tout centraliser ».

   C'est la demande n° 1 du client, et c'est la seule vue qui traverse
   les salons. Un lead appartient à un salon ; un contact appartient à
   l'entreprise. Le carnet est la mémoire commerciale : ce que la société
   a rencontré, quand, par qui, et ce que c'est devenu.

   Il réunit les contacts du salon en cours et ceux des salons passés,
   quelle que soit leur origine — photo de carte, échange de carte
   numérique, scan de badge, import ou saisie.
   ============================================================ */

/** Vue unifiée : le salon en cours et l'historique, même forme. */
function carnetComplet(){
  const actuels = S.leads.map(function(l){
    return {
      id:l.id, prenom:l.prenom, nom:l.nom, fonction:l.fonction, societe:l.societe,
      pays:l.pays, email:l.email, tel:l.tel, statut:l.statut, crm:l.crm,
      salon:SEED.salon.nom, salonId:"wire26", date:l.date,
      source:l.source || "Photo de carte", relance:false, opportunite:false, courant:true
    };
  });
  const passes = (SEED.historique || []).map(function(h){
    return {
      id:h.id, prenom:h.prenom, nom:h.nom, fonction:h.fonction, societe:h.societe,
      pays:h.pays, email:h.email, tel:h.tel, statut:h.statut, crm:h.crm,
      salon:h.salon, salonId:h.salonId, date:h.date, source:h.source,
      relance:h.relance, opportunite:h.opportunite, courant:false
    };
  });
  /* Une fiche absorbee par une fusion sort du carnet. On ne la supprime
     pas de l historique — une edition close ne se reecrit pas — on cesse
     de la compter, et la fiche survivante garde son identifiant dans
     `fusionDe`. Sans ce filtre, la paire fusionnee reapparaissait au
     tour suivant et le compteur ne bougeait jamais. */
  const absorbes = S.absorbes || [];
  return actuels.concat(passes).filter(function(c){ return absorbes.indexOf(c.id) < 0; });
}

function carnetFiltre(){
  const q = (S.qCarnet || "").trim().toLowerCase();
  return carnetComplet().filter(function(c){
    if (S.fCarnet.salon && c.salonId !== S.fCarnet.salon) return false;
    if (S.fCarnet.source && c.source !== S.fCarnet.source) return false;
    if (S.fCarnet.statut && c.statut !== S.fCarnet.statut) return false;
    if (S.fCarnet.opportunite === "oui" && !c.opportunite) return false;
    if (!q) return true;
    return (c.prenom + " " + c.nom + " " + c.societe + " " + c.pays + " " + c.fonction + " " + c.email)
      .toLowerCase().indexOf(q) >= 0;
  }).sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
}

/** Doublons réels du carnet, selon les règles de rapprochement de la spécification. */
function doublonsCarnet(rows){
  const vus = { email:{}, tel:{}, personne:{} };
  let n = 0;
  rows.forEach(function(c){
    const e = (c.email || "").trim().toLowerCase();
    const t = (c.tel || "").replace(/[^0-9+]/g, "");
    const k = ((c.prenom || "") + "|" + (c.nom || "") + "|" + (c.societe || "")).toLowerCase();
    let d = false;
    if (e) { if (vus.email[e]) d = true; else vus.email[e] = 1; }
    if (t) { if (vus.tel[t]) d = true; else vus.tel[t] = 1; }
    if (vus.personne[k]) d = true; else vus.personne[k] = 1;
    if (d) n++;
  });
  return n;
}

/* ============================================================
   Pilotage par salon.

   C'est le seul écran qui répond à la question que pose un comité de
   direction : « ce salon, il nous a rapporté quoi ? »

   Le chiffre central est le coût par lead qualifié. Sans dénominateur
   monétaire, « performance salon » n'est qu'un slogan : on compte des
   cartes. Avec lui, on compare une édition à l'autre et on arbitre le
   budget de l'année suivante.

   Deux honnêtetés tenues ici :
   — le salon en cours affiche un POTENTIEL, jamais un pipeline signé ;
   — un salon récent a mécaniquement moins d'opportunités mûres qu'un
     salon ancien, et l'écran le dit au lieu de laisser croire à un échec.
   ============================================================ */

/* ============================================================
   Le budget est REGLABLE. C'est la seule facon de repondre a la question
   que pose vraiment un comite de direction : « si on prend un stand deux
   fois plus petit l'annee prochaine, ca donne quoi ? » Un tableau qu'on
   ne peut pas interroger ne se discute pas, il se subit.

   Les retouches vivent dans S.budgets et ne touchent jamais SEED : on
   revient a la valeur reelle d'un clic.
   ============================================================ */
const POSTES = [
  ["stand",       "Stand"],
  ["amenagement", "Aménagement"],
  ["personnel",   "Personnel"],
  ["voyage",      "Voyage et hébergement"],
  ["marketing",   "Marketing et impression"]
];

function budgetEffectif(id){
  const base = (SEED.budgets || {})[id];
  if (!base) return base;
  const perso = (S.budgets && S.budgets[id]) || {};
  const b = {};
  Object.keys(base).forEach(function(k){ b[k] = base[k]; });
  Object.keys(perso).forEach(function(k){ b[k] = perso[k]; });
  b.total = POSTES.reduce(function(t, p){ return t + (b[p[0]] || 0); }, 0);
  b.retouche = Object.keys(perso).length > 0;
  return b;
}
function retoucherBudget(id, poste, valeur){
  if (!S.budgets) S.budgets = {};
  if (!S.budgets[id]) S.budgets[id] = {};
  S.budgets[id][poste] = Math.max(0, Math.round(valeur));
}

/** Tous les contacts d'une édition, salon en cours comme historique. */
function contactsDuSalon(id){
  if (id === "wire26") {
    return S.leads.map(function(l){
      return {
        statut:l.statut, crm:l.crm, source:l.source || "Photo de carte",
        email:l.email, tel:l.tel,
        qualifieV1: qualifie(l),
        opportunite:false, montant:0, potentiel:l.potentiel || 0
      };
    });
  }
  return (SEED.historique || []).filter(function(h){ return h.salonId === id; }).map(function(h){
    return {
      statut:h.statut, crm:h.crm, source:h.source, email:h.email, tel:h.tel,
      qualifieV1: null,          /* non mesurable : l historique ne porte ni critères ni score */
      opportunite:!!h.opportunite, montant:h.montant || 0, potentiel:0
    };
  });
}

/** Le bilan chiffré d'une édition. */
function bilanSalon(id){
  const b = budgetEffectif(id);
  const c = contactsDuSalon(id);
  /* Une seule definition par colonne. Les editions closes ne portent ni
     les quatre criteres ni le score : la seule condition verifiable
     partout est l e-mail exploitable. On compare donc TOUT en v0, et on
     l etiquette a l ecran. Melanger deux definitions dans un meme tableau
     produit un cout par lead qualifie qui ne veut rien dire. */
  const qualifies = c.filter(qualifieV0).length;
  const qualifiesV1 = c.filter(function(x){ return x.qualifieV1 === true; }).length;
  const chauds = c.filter(function(x){ return x.statut === "Chaud"; }).length;
  const opp = c.filter(function(x){ return x.opportunite; }).length;
  const pipeline = c.reduce(function(s,x){ return s + x.montant; }, 0);
  const potentiel = c.reduce(function(s,x){ return s + x.potentiel; }, 0);
  const cout = b ? b.total : 0;
  return {
    id:id, nom:b ? b.nom : id, ville:b ? b.ville : "", du:b ? b.du : "",
    jours:b ? b.jours : 0, commerciaux:b ? b.commerciaux : 0,
    cout:cout, budget:b,
    contacts:c.length, qualifies:qualifies, qualifiesV1:qualifiesV1, chauds:chauds,
    opportunites:opp, pipeline:pipeline, potentiel:potentiel,
    encours:(id === "wire26"),
    // Le chiffre central. Il n'a de sens que rapporté aux fiches
    // réellement exploitables, jamais au volume brut de cartes.
    cplq: qualifies ? Math.round(cout / qualifies) : 0,
    coutParContact: c.length ? Math.round(cout / c.length) : 0,
    tauxQualif: pct(qualifies, c.length),
    v1Disponible: (id === "wire26"),
    tauxOpp: pct(opp, qualifies || 1),
    retour: cout ? Math.round((pipeline || potentiel) / cout * 100) / 100 : 0
  };
}

/** Transforme la saisie de la borne en lead, dans le même flux que les autres. */
function enregistrerKiosque(){
  const v = S.kiosque.saisie;
  if (!(v.nom || "").trim()) return;
  const morceaux = String(v.nom).trim().split(/\s+/);
  const prenom = morceaux.shift();
  const nom = morceaux.join(" ") || prenom;
  const l = {
    id:"K" + (S.leads.length + 1) + "-" + S.kiosque.compteur,
    prenom:prenom, nom:nom, fonction:"", societe:v.societe || "",
    pays:"", codePays:"", email:v.email || "", tel:v.tel || "",
    // Les reponses du visiteur priment ; l origine ne retombe sur la borne
    // que s il n a rien choisi. Ecraser sa reponse ferait perdre des points
    // qu il a lui-meme donnes.
    origine:v.origine || "Borne libre-service",
    profil:v.profil || "", machine:v.machine || "", produit:v.produit || "",
    niveau:v.niveau || "", suivi:v.suivi || "",
    commercial:S.me, date:"2026-06-17", note:"", crm:false,
    consentement:true, optin:!!v.optin, source:"Borne libre-service",
    salon:SEED.salon.nom, salonId:"wire26",
    qualifieEn:1, serie:0, verso:false
  };
  const d = scoreDetail(l);
  l.score = d.total; l.statut = statutDe(d.total);
  S.leads.unshift(l);
  S.kiosque.compteur++;
  sauver();
}

/* ============================================================
   LE MAPPING EFFECTIF.

   L ecran d export promettait « modifiable champ par champ » alors que
   les lignes etaient des <span> statiques. Il l est maintenant : les
   retouches vivent dans S.mapping, cette fonction les applique, et TOUT
   ce qui produit un fichier passe par elle. Un mapping qu on peut
   changer sans que l export suive serait pire que pas de mapping.
   ============================================================ */
function champsCible(cle){
  const base = CRM[cle].champs;
  const perso = (S.mapping && S.mapping[cle]) || {};
  return base.map(function(c){
    const id = c.src || (c.calc && c.libelle) || c.api;
    const o = perso[id];
    if (!o) return c;
    const copie = {};
    Object.keys(c).forEach(function(k){ copie[k] = c[k]; });
    if (o.api) copie.api = o.api;
    copie.exclu = !!o.exclu;
    return copie;
  }).filter(function(c){ return !c.exclu; });
}
/** Les champs AVEC les exclus, pour l ecran de reglage. */
function champsCibleTous(cle){
  const base = CRM[cle].champs;
  const perso = (S.mapping && S.mapping[cle]) || {};
  return base.map(function(c){
    const id = c.src || (c.calc && c.libelle) || c.api;
    const o = perso[id] || {};
    const copie = {};
    Object.keys(c).forEach(function(k){ copie[k] = c[k]; });
    copie.idMap = id;
    copie.apiDefaut = c.api;
    if (o.api) copie.api = o.api;
    copie.exclu = !!o.exclu;
    copie.retouche = !!(o.api && o.api !== c.api) || !!o.exclu;
    return copie;
  });
}
function retoucherMapping(cle, id, champ, valeur){
  if (!S.mapping) S.mapping = {};
  if (!S.mapping[cle]) S.mapping[cle] = {};
  if (!S.mapping[cle][id]) S.mapping[cle][id] = {};
  S.mapping[cle][id][champ] = valeur;
}
function reinitialiserMapping(cle){
  if (S.mapping) delete S.mapping[cle];
}

/** Applique les regles de rapprochement de la specification aux donnees
 *  affichees, pour que le chiffre montre soit verifiable a l ecran. */
function doublonsPotentiels(L){
  const parEmail = new Map(), parTel = new Map(), parPersonne = new Map();
  let n = 0;
  L.forEach(function(l){
    const e = (l.email || "").trim().toLowerCase();
    const t = (l.tel || "").replace(/[^0-9+]/g, "");
    const k = ((l.prenom || "") + "|" + (l.nom || "") + "|" + (l.societe || "")).toLowerCase();
    let vu = false;
    if (e) { if (parEmail.has(e)) vu = true; else parEmail.set(e, 1); }
    if (t) { if (parTel.has(t)) vu = true; else parTel.set(t, 1); }
    if (parPersonne.has(k)) vu = true; else parPersonne.set(k, 1);
    if (vu) n++;
  });
  return n;
}

/* ============================================================
   Vue : relances post-salon
   ============================================================ */
/* ============================================================
   Les rappels. L'écran décrivait une séquence figée : quatre jalons
   écrits en dur, aucun levier. Or le délai de rappel est justement la
   variable que chaque entreprise règle à sa main — deux jours chez un
   fabricant qui vend sur devis, trois semaines chez un distributeur.

   Chaque étape porte donc son délai et son interrupteur, et le nombre de
   contacts concernés suit immédiatement.
   ============================================================ */
const JALONS = [
  { cle:"accuse",  nom:"Accusé de rencontre",
    quoi:"Envoyé le soir même, signé du commercial qui a rencontré le contact, avec sa carte numérique.",
    qui:function(l){ return l.statut === "Chaud" || l.statut === "Tiède"; } },
  { cle:"reponse", nom:"Réponse à la demande",
    quoi:"Un devis pour ceux à qui on en a promis un, de la documentation pour les autres. Le contenu dépend de ce que le commercial a coché sur le stand.",
    qui:function(l){ return l.suivi === "Devis sous 48 h" || l.suivi === "Envoi documentation"; } },
  { cle:"appel",   nom:"Appel du commercial",
    quoi:"Une tâche dans le CRM, pas un e-mail automatique. Un contact chaud mérite qu’on décroche.",
    qui:function(l){ return l.statut === "Chaud"; } },
  { cle:"reprise", nom:"Reprise de contact",
    quoi:"Pour les contacts tièdes qui n’ont pas bougé. Les froids partent en communication marketing.",
    qui:function(l){ return l.statut === "Tiède" && !l.crm; } }
];
const SEQUENCE_DEFAUT = { accuse:{j:0,on:true}, reponse:{j:2,on:true}, appel:{j:7,on:true}, reprise:{j:30,on:true} };

function sequenceEffective(){
  const s = {};
  Object.keys(SEQUENCE_DEFAUT).forEach(function(k){
    const d = SEQUENCE_DEFAUT[k], p = (S.sequence || {})[k] || {};
    s[k] = { j: p.j != null ? p.j : d.j, on: p.on != null ? p.on : d.on };
  });
  return s;
}
function reglerJalon(cle, champ, valeur){
  if (!S.sequence) S.sequence = {};
  if (!S.sequence[cle]) S.sequence[cle] = {};
  S.sequence[cle][champ] = valeur;
}

function vueRelances(){
  const parSuivi = grouper(S.leads, "suivi");
  const seq = sequenceEffective();
  const actifs = JALONS.filter(function(j){ return seq[j.cle].on; });
  const touches = uniq(actifs.reduce(function(a, j){
    return a.concat(S.leads.filter(j.qui).map(function(l){ return l.id; }));
  }, [])).length;
  const dernier = actifs.length ? Math.max.apply(null, actifs.map(function(j){ return seq[j.cle].j; })) : 0;
  const retouche = !!(S.sequence && Object.keys(S.sequence).length);

  return '<div class="page">' +
    '<div class="pagehead"><p class="eyebrow">Après le salon</p><h1>Les rappels</h1>' +
      '<p>Le salon ne rapporte rien, le rappel si. Réglez le délai de chaque étape et coupez ' +
      'celles qui ne vous concernent pas : le nombre de contacts touchés suit immédiatement.</p></div>' +

    '<div class="kpigrid" style="margin-bottom:18px">' +
      kpi("Étapes actives", actifs.length + " sur " + JALONS.length, "coupez ce qui ne sert pas", null) +
      kpi("Contacts touchés", touches, pct(touches, S.leads.length) + " du salon", null) +
      kpi("Séquence terminée", "J+" + dernier, "après la fin du salon", null) +
      kpi("Sans e-mail utilisable",
          S.leads.filter(function(l){ return !emailExploitable(l); }).length,
          "aucun rappel ne peut partir", null) +
    '</div>' +

    '<div class="chartgrid g-2">' +
      '<section class="chart"><h3>La séquence</h3>' +
        '<p class="hint">Délais comptés à partir de la fin du salon.</p>' +
        '<div class="body">' +
          JALONS.map(function(j){
            const e = seq[j.cle];
            const n = S.leads.filter(j.qui).length;
            return '<div class="jalon' + (e.on ? "" : " coupe") + '">' +
              '<div class="jalon__tete">' +
                '<b>' + esc(j.nom) + '</b>' +
                '<button type="button" class="btn btn-ghost btn-sm bc-appui" data-jalon-on="' +
                  j.cle + '" aria-pressed="' + (e.on ? "true" : "false") + '">' +
                  (e.on ? "Active" : "Coupée") + '</button>' +
              '</div>' +
              '<p class="jalon__quoi">' + esc(j.quoi) + '</p>' +
              '<div class="posterow" style="border-bottom:0;padding-bottom:0">' +
                '<label for="j-' + j.cle + '">Délai</label>' +
                '<input type="range" id="j-' + j.cle + '" data-jalon-j="' + j.cle + '" ' +
                  'min="0" max="60" step="1" value="' + e.j + '"' + (e.on ? "" : " disabled") +
                  ' aria-label="Délai de l’étape ' + esc(j.nom) + ', en jours">' +
                '<span class="vv num">J+' + e.j + '</span>' +
              '</div>' +
              '<p class="jalon__n">' + (e.on
                ? n + ' contact' + (n > 1 ? 's' : '') + ' concerné' + (n > 1 ? 's' : '')
                : 'étape coupée : personne n’est rappelé ici') + '</p>' +
            '</div>';
          }).join("") +
          (retouche
            ? '<button type="button" class="btn btn-ghost btn-sm bc-appui" data-seq-reset="1" ' +
              'style="margin-top:14px">Revenir à la séquence par défaut</button>'
            : '<p class="estampille" style="display:block;margin-top:14px">séquence par défaut</p>') +
        '</div></section>' +
      barChart("Charge de travail par nature d’action", "Ce que l’équipe doit produire en rentrant.", parSuivi, "var(--warm)") +
    '</div>' +

    '<div class="card card-p" style="margin-top:14px;display:flex;gap:11px;align-items:flex-start">' +
      '<span style="color:var(--verm-e);flex:none;margin-top:1px">' + ic("clock",17) + '</span>' +
      '<p style="font-size:13px;color:var(--ink-2);line-height:1.6;max-width:82ch">' +
        '<b style="color:var(--ink)">Un engagement, pas un objectif.</b> Passé le délai de la ' +
        'première étape, le contact remonte au responsable de zone. On ne reproche pas à un ' +
        'commercial de ne pas avoir signé, on lui reproche de ne pas avoir répondu.</p></div>' +
  '</div>';
}

/* ============================================================
   Le cadre légal. L'écran était un tableau de dix intentions, toutes
   marquées « mise en œuvre » par nous — c'est-à-dire une auto-évaluation
   que le client ne pouvait ni contester ni suivre.

   Il devient un registre qu'il tient LUI : chaque exigence porte l'état
   qu'il lui donne, et la durée de conservation qu'il fixe ici est celle
   que le visiteur lit sur la tablette du comptoir. Un réglage de
   conformité qui ne change rien ailleurs n'est pas un réglage.
   ============================================================ */
const EXIGENCES = [
  ["info",     "Information de la personne",
   "Un écran d’information s’affiche au moment de la prise de vue, en une phrase. Il n’ajoute pas d’étape."],
  ["base",     "Base légale",
   "Intérêt légitime pour la prospection entre professionnels, accord explicite pour la communication marketing. Les deux sont enregistrés séparément."],
  ["preuve",   "Preuve de l’accord",
   "Date et heure, salon, commercial, version du texte affiché. Conservée aussi longtemps que la donnée."],
  ["duree",    "Durée de conservation",
   "Réglée ci-dessous. Effacement automatique à l’échéance, alerte trente jours avant."],
  ["droits",   "Droits des personnes",
   "Accès, correction, effacement et opposition traités sous trente jours depuis la page publique de la carte."],
  ["heberg",   "Hébergement",
   "Union européenne. Aucun transfert hors UE pour les contacts."],
  ["journal",  "Journal des accès",
   "Toute lecture, tout export et tout envoi au CRM sont enregistrés avec l’auteur, la date et le périmètre."],
  ["perte",    "Téléphone perdu en salon",
   "Effacement à distance des données locales et fermeture de la session, sans perdre les contacts déjà envoyés."],
  ["chiffre",  "Chiffrement",
   "TLS 1.3 pendant le transport, chiffrement au repos, cloisonnement strict par entreprise."],
  ["soustrait","Sous-traitance",
   "Contrat de sous-traitance et liste des sous-traitants tenus à disposition du client."]
];
const ETATS = [
  ["fait",    "En place",          "t-ok"],
  ["cours",   "En cours",          "t-neutral"],
  ["contrat", "À contractualiser", "t-warm"],
  ["hors",    "Hors périmètre",    "t-neutral"]
];
const ETAT_DEFAUT = { soustrait:"contrat" };

function etatExigence(cle){
  return (S.conformite && S.conformite[cle]) || ETAT_DEFAUT[cle] || "fait";
}
function poserEtatExigence(cle, etat){
  if (!S.conformite) S.conformite = {};
  S.conformite[cle] = etat;
}
/** La durée que le visiteur lit sur la tablette. */
function dureeConservation(){
  return (S.dureeMois != null) ? S.dureeMois : 24;
}

function vueConformite(){
  const compte = {};
  ETATS.forEach(function(e){ compte[e[0]] = 0; });
  EXIGENCES.forEach(function(x){ compte[etatExigence(x[0])]++; });
  const mois = dureeConservation();
  const retouche = !!(S.conformite && Object.keys(S.conformite).length) || S.dureeMois != null;

  return '<div class="page">' +
    '<div class="pagehead"><p class="eyebrow">Configuration</p><h1>Le cadre légal</h1>' +
      '<p>Sur un stand, on ne fait signer aucun formulaire de trois écrans : la règle doit tenir ' +
      'en une phrase affichée au bon moment, sinon elle est contournée. Ce registre est le vôtre — ' +
      'donnez à chaque exigence l’état où elle en est réellement chez vous.</p></div>' +

    '<div class="kpigrid" style="margin-bottom:18px">' +
      ETATS.map(function(e){
        return kpi(e[1], compte[e[0]], "sur " + EXIGENCES.length + " exigences", null);
      }).join("") +
    '</div>' +

    '<div class="cote"><span class="cote__val">01&nbsp;&nbsp;Durée de conservation</span></div>' +
    '<section class="chart" style="margin-bottom:20px">' +
      '<h3>Combien de temps gardez-vous un contact ?</h3>' +
      '<p class="hint" style="margin-top:8px">Cette durée n’est pas décorative : c’est le nombre ' +
        'que le visiteur lit sur la tablette du comptoir avant de cocher son accord. ' +
        'Changez-la, et le texte de la borne change.</p>' +
      '<div class="body" style="margin-top:16px">' +
        '<div class="posterow" style="border-bottom:0">' +
          '<label for="duree-mois">Conservation</label>' +
          '<input type="range" id="duree-mois" data-duree="1" min="3" max="60" step="1" ' +
            'value="' + mois + '" aria-label="Durée de conservation, en mois">' +
          '<span class="vv num">' + mois + ' mois</span>' +
        '</div>' +
        '<p style="font:400 13px/1.55 var(--f-ui);color:var(--encre2);margin-top:14px;' +
          'padding-left:12px;border-left:1px solid var(--arete)">' +
          'Texte affiché au visiteur : « Vos coordonnées sont conservées ' + mois + '&nbsp;mois ' +
          'après notre dernier échange, puis effacées. »</p>' +
        (mois > 36
          ? '<p style="font:400 13px/1.55 var(--f-ui);color:var(--verm-e);margin-top:12px">' +
            'Au-delà de trois ans, une durée de conservation devient difficile à justifier pour ' +
            'un simple contact de salon.</p>'
          : "") +
      '</div>' +
    '</section>' +

    '<div class="cote"><span class="cote__val">02&nbsp;&nbsp;Le registre</span></div>' +
    '<div class="tablewrap"><div class="tscroll"><table style="min-width:760px">' +
      '<thead><tr><th scope="col">Exigence</th><th scope="col">Ce qui est prévu</th>' +
        '<th scope="col">Où vous en êtes</th></tr></thead><tbody>' +
      EXIGENCES.map(function(x){
        const e = etatExigence(x[0]);
        return '<tr><td style="width:200px"><span class="cellname">' + esc(x[1]) + '</span></td>' +
          '<td style="color:var(--encre2);line-height:1.55">' + esc(x[2]) + '</td>' +
          '<td><div class="qchips" style="grid-template-columns:repeat(2,1fr);min-width:230px">' +
            ETATS.map(function(et){
              return '<button type="button" class="qchip bc-appui" style="min-height:34px;font-size:12px" ' +
                (e === et[0] ? 'aria-pressed="true" ' : "") +
                'data-conf="' + x[0] + '|' + et[0] + '">' + esc(et[1]) + '</button>';
            }).join("") +
          '</div></td></tr>';
      }).join("") +
      '</tbody></table></div>' +
      '<div class="tfoot"><span>Aucun de ces états n’est coché par nous : un fournisseur qui ' +
        'déclare lui-même sa propre conformité ne prouve rien. Le registre sert à savoir où ' +
        'vous en êtes, et à le montrer.</span></div>' +
    '</div>' +

    (retouche
      ? '<button type="button" class="btn btn-ghost btn-sm bc-appui" data-conf-reset="1" ' +
        'style="margin-top:16px">Revenir aux valeurs de départ</button>'
      : "") +
  '</div>';
}

function fermerDrawer(){

  if (cible && typeof cible.focus === "function") cible.focus({ preventScroll:true });
  leadOuvert = null;
}

/** Piege de focus : tant que le panneau est ouvert, Tab tourne dedans. */
function piegerFocus(ev){
  const d = document.getElementById("drawer");
  if (!d || !d.classList.contains("open")) return;
  const f = [].slice.call(d.querySelectorAll(
    'button:not([disabled]),a[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'
  )).filter(function(x){ return x.offsetParent !== null; });
  if (!f.length) return;
  const prem = f[0], der = f[f.length - 1];
  if (ev.shiftKey && document.activeElement === prem) { ev.preventDefault(); der.focus(); }
  else if (!ev.shiftKey && document.activeElement === der) { ev.preventDefault(); prem.focus(); }
}

/* ============================================================
   Export de fichiers (capacité « downloads » de l'Artifact)
   ============================================================ */
function csvEchappe(v){
  const s = String(v == null ? "" : v);
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function construireCSV(rows){
  const cible = CRM[S.crmCible];
  const entetes = champsCible(S.crmCible).map(function(c){ return c.api; });
  const lignes = rows.map(function(l){
    return champsCible(S.crmCible).map(function(c){ return csvEchappe(valeurMappee(c, l)); }).join(";");
  });
  // BOM UTF-8 : sans lui, Excel en Europe casse les accents.
  return "\ufeff" + entetes.join(";") + "\r\n" + lignes.join("\r\n") + "\r\n";
}
function construireJSON(rows){
  const cible = CRM[S.crmCible];
  return JSON.stringify({
    source:"BinchamCard",
    salon:SEED.salon.nom,
    cible:cible.nom,
    objet:cible.objet,
    api:cible.api,
    avertissement:"Jeu de d\u00e9monstration. Les enregistrements ci-dessous ne d\u00e9crivent aucune personne r\u00e9elle.",
    nombre:rows.length,
    enregistrements: rows.map(function(l){
      const o = {};
      champsCible(S.crmCible).forEach(function(c){ o[c.api] = valeurMappee(c, l); });
      return o;
    })
  }, null, 2);
}

/** Repli hors plateforme : quand la page est hebergee ailleurs (domaine
 *  propre, Netlify, GitHub Pages), la capacite « downloads » n existe pas.
 *  On retombe alors sur un telechargement navigateur classique. */
function telechargerLocalement(nomFichier, contenu){
  try {
    const blob = new Blob([contenu], { type:"text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nomFichier;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast("Fichier « " + nomFichier + " » enregistré");
    return true;
  } catch (e) { return false; }
}

async function telecharger(nomFichier, contenu, secours){
  const dl = await (window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null));
  if (!dl) {
    if (!telechargerLocalement(nomFichier, contenu)) {
      toast("Le téléchargement n’est pas disponible ici.", "err");
    }
    return;
  }
  try {
    await dl.save({ filename: nomFichier, data: contenu });
    toast("Fichier « " + nomFichier + " » enregistré");
  } catch (e) {
    const code = e && e.code;
    if (code === "declined") return;                       // l'utilisateur a refusé : on ne relance pas
    if (code === "extension_not_enabled" && secours) {
      try {
        await dl.save({ filename: secours, data: contenu });
        toast("Enregistré en « " + secours + " » (le format CSV n’est pas autorisé ici)");
        return;
      } catch (e2) { if (e2 && e2.code === "declined") return; }
    }
    if (code === "rate_limited") { toast("Une demande d’enregistrement est déjà ouverte.", "err"); return; }
    toast("Échec de l’enregistrement du fichier.", "err");
  }
}

function exporterCSV(rows, suffixe){
  if (!rows.length) { toast("Aucun lead à exporter.", "err"); return; }
  const base = "binchamcard-" + SEED.salon.nom.toLowerCase().replace(/\s+/g,"") + (suffixe ? "-" + suffixe : "") + "-" + S.crmCible;
  telecharger(base + ".csv", construireCSV(rows), base + ".txt");
}
/** Export du carnet : une ligne par contact, tous salons confondus.
 *  Colonnes neutres, lisibles par n importe quel outil. */
function exporterCarnet(){
  const rows = carnetFiltre();
  if (!rows.length) { toast("Aucun contact a exporter.", "err"); return; }
  const cols = [["prenom","Prenom"],["nom","Nom"],["fonction","Fonction"],["societe","Societe"],
                ["pays","Pays"],["email","Email"],["tel","Telephone"],["salon","Salon"],
                ["date","Date"],["source","Mode de capture"],["statut","Statut"]];
  const lignes = rows.map(function(c){
    return cols.map(function(k){ return csvEchappe(c[k[0]]); })
      .concat([csvEchappe(c.opportunite ? "Opportunite" : c.relance ? "Relance" : c.crm ? "Dans le CRM" : "Sans suite")])
      .join(";");
  });
  // Fin de ligne CRLF construite par code : un retour a la ligne ecrit
  // litteralement dans la source casserait la chaine JavaScript.
  const CRLF = String.fromCharCode(13, 10);
  const csv = "﻿" + cols.map(function(k){ return k[1]; }).concat(["Suite donnee"]).join(";") +
              CRLF + lignes.join(CRLF) + CRLF;
  telecharger("binchamcard-carnet.csv", csv, "binchamcard-carnet.txt");
}

function exporterJSON(rows){
  if (!rows.length) { toast("Aucun lead à exporter.", "err"); return; }
  telecharger("binchamcard-" + S.crmCible + ".json", construireJSON(rows));
}

/* ============================================================
   Câblage des interactions (délégation globale)
   ============================================================ */
document.addEventListener("click", function(ev){
  const t = ev.target;
  const near = function(sel){ return t.closest(sel); };
  let el;

  /* --- rôles et navigation --- */
  if ((el = near("[data-role]")))   { setRole(el.dataset.role); return; }
  if ((el = near("[data-role-go]"))){ setRole(el.dataset.roleGo); return; }
  if ((el = near("[data-go]"))) {
    // « role|vue|onglet du telephone » : un bouton d argument ouvre
    // directement l ecran qui le demontre.
    const p = String(el.dataset.go).split("|");
    setRole(p[0]);
    if (p[1]) S.view = p[1];
    if (p[2]) { S.ptab = p[2]; S.pscreen = null; S.devoile = null; }
    render();
    const m = document.getElementById("main");
    if (m) m.focus({ preventScroll:true });
    window.scrollTo({ top:0, behavior:"instant" });
    return;
  }
  if ((el = near("[data-view]")))   { setView(el.dataset.view); return; }
  if ((el = near("[data-crm-go]"))) { S.crmCible = el.dataset.crmGo; setView("crm"); return; }
  if (near("#btn-reset")) { reinitialiser(); return; }

  /* --- téléphone : onglets --- */
  if ((el = near("[data-ptab]"))) {
    S.ptab = el.dataset.ptab; S.pscreen = null; S.pdraft = null; S.capturing = false;
    rendreEnGardantLeFocus(); return;
  }

  /* --- capture --- */
  if (near("#btn-shot")) {
    if (S.capturing) return;
    S.flash = true; rendreEnGardantLeFocus();
    setTimeout(function(){
      S.flash = false; S.capturing = true;
      const modele = CAPTURES_BRUTES[S.shot % CAPTURES_BRUTES.length];
      const copie = JSON.parse(JSON.stringify(modele));
      copie.id = "P" + (Date.now() % 100000);
      copie.capture = "à l’instant";
      S.pile.unshift(copie);
      S.shot++;
      sauver(); rendreEnGardantLeFocus();
      setTimeout(function(){ S.capturing = false; rendreEnGardantLeFocus(); }, 1250);
    }, 260);
    return;
  }

  /* --- pile et fiche --- */
  if ((el = near("[data-pile]"))) {
    const p = S.pile.find(function(x){ return x.id === el.dataset.pile; });
    if (p) { S.pdraft = JSON.parse(JSON.stringify(p)); S.pscreen = p.id; rendreEnGardantLeFocus(); }
    return;
  }
  if (near("#btn-back")) { S.pscreen = null; S.pdraft = null; rendreEnGardantLeFocus(); return; }

  /* --- Mode kiosque --- */
  if ((el = near("[data-kgo]"))) {
    const vers = el.dataset.kgo;
    if (vers === "merci") enregistrerKiosque();
    if (vers === "accueil") S.kiosque.saisie = {};
    S.kiosque.etape = vers;
    render();
    if (vers === "merci" && S.kiosque.autoReset) armerRearmage();
    return;
  }
  if (near("[data-kback]")) {
    // Retour d une etape. La saisie est CONSERVEE : un visiteur qui revient
    // corriger une faute de frappe ne doit pas tout retaper.
    clearInterval(minuterieKiosque);
    const suite = ["accueil", "coordonnees"].concat(S.kiosque.interet ? ["interet"] : []).concat(["merci"]);
    const i = suite.indexOf(S.kiosque.etape);
    if (i > 0) {
      // Depuis le remerciement, on retire le lead qui vient d etre cree :
      // sinon corriger la saisie en fabriquerait un second.
      if (S.kiosque.etape === "merci" && S.leads.length && String(S.leads[0].id).indexOf("K") === 0) {
        S.leads.shift();
        S.kiosque.compteur = Math.max(1, S.kiosque.compteur - 1);
        sauver();
      }
      S.kiosque.etape = suite[i - 1];
      render();
    }
    return;
  }
  if ((el = near("[data-kq]"))) {
    const c = el.dataset.kq;
    S.kiosque.saisie[c] = (S.kiosque.saisie[c] === el.dataset.v) ? "" : el.dataset.v;
    rendreEnGardantLeFocus(); return;
  }
  if ((el = near("[data-kset]"))) {
    const m = { kAuto:"autoReset", kInteret:"interet", kOptin:"optin" }[el.dataset.kset];
    if (m) { S.kiosque[m] = !S.kiosque[m]; sauver(); rendreEnGardantLeFocus(); }
    return;
  }

  /* --- Devoilement --- */
  if (near("#dev-fin")) { S.devoile = null; S.ptab = S.pile.length ? "pile" : "capture"; rendreEnGardantLeFocus(); return; }
  if (near("#dev-corriger")) {
    const l = byId(S.leads, S.devoile);
    const m = l && pointManquant(l);
    if (!l || !m || m.multiple) return;
    // On applique exactement le geste le moins cher qui suffit.
    if (m.choix.type === "champ") l[m.choix.cle] = m.choix.valeur;
    else l[m.choix.cle] = MODELE_COMPLET[m.choix.cle] || "Renseigné";
    const d = scoreDetail(l);
    l.score = d.total; l.statut = statutDe(d.total);
    S.rejeu = true;
    sauver(); rendreEnGardantLeFocus();
    toast("Corrigé · " + d.total + "/100 · " + l.statut);
    return;
  }
  if ((el = near("[data-q]"))) {
    if (!S.pdraft) return;
    const cle = el.dataset.q, val = el.dataset.v;
    if (el.dataset.multi === "1") {
      const liste = String(S.pdraft[cle] || "").split(", ").filter(Boolean);
      const i = liste.indexOf(val);
      if (i >= 0) liste.splice(i, 1); else liste.push(val);
      S.pdraft[cle] = liste.join(", ");
    } else {
      S.pdraft[cle] = (S.pdraft[cle] === val) ? "" : val;
    }
    rendreEnGardantLeFocus(); return;
  }
  if (near("#btn-voice")) {
    if (!S.pdraft) return;
    S.pdraft.note = "Recherche une ligne complète pour l’an prochain. Décision partagée avec la maison mère. Rappeler après le salon.";
    rendreEnGardantLeFocus(); toast("Note vocale transcrite"); return;
  }
  if (near("#btn-save")) {
    if (!S.pdraft) return;
    const p = S.pdraft;
    const det = scoreDetail(p);
    S.leads.unshift({
      id:"L" + (Date.now() % 100000), prenom:p.prenom, nom:p.nom, fonction:p.fonction,
      societe:p.societe, pays:p.pays, codePays:p.codePays, email:p.email, tel:p.tel,
      origine:p.origine || "Passage sur stand", profil:p.profil || "Fabricant",
      machine:p.machine || "", produit:p.produit || "", niveau:p.niveau || "Veille technologique",
      suivi:p.suivi || "Envoi documentation", score:det.total, statut:statutDe(det.total),
      commercial:S.me, date:"2026-06-17", note:p.note || "", crm:false, consentement:true,
      // La fiche vient d etre qualifiee a l instant : le delai est celui du
      // triage, et le potentiel decoule du niveau de demande declare.
      qualifieEn:1, serie:0, verso:false,
      potentiel:({"Projet budgété":62000,"Appel d'offres en cours":48000,"Projet à l'étude":25000,
                  "Renouvellement parc":18000,"Veille technologique":6000})[p.niveau] || 6000,
      source:"Photo de carte", salon:SEED.salon.nom, salonId:"wire26"
    });
    S.pile = S.pile.filter(function(x){ return x.id !== S.pscreen; });
    const cree = S.leads[0];
    S.pscreen = null; S.pdraft = null;
    S.devoile = cree.id;          // declenche le Devoilement
    sauver(); rendreEnGardantLeFocus();
    return;
  }

  /* --- carte et réseau --- */
  if (near("#btn-toggle-net")) { S.online = !S.online; rendreEnGardantLeFocus();
    toast(S.online ? "Réseau rétabli, file en cours de vidage" : "Hors ligne : les captures continuent"); return; }
  if (near("#btn-nfc")) { toast("Approchez le téléphone du visiteur (NFC simulé)"); return; }
  if (near("#btn-copylink")) {
    const url = QRDATA[S.me].url;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function(){ toast("Lien copié : " + url); },
        function(){ toast("Lien : " + url); });
    } else toast("Lien : " + url);
    return;
  }
  if ((el = near("[data-me]"))) { S.me = el.dataset.me; sauver(); rendreEnGardantLeFocus(); return; }
  if (near("#btn-export-vcard")) {
    const moi = byId(SEED.commerciaux, S.me);
    /* .vcf, et non .txt : un fichier nomme .txt n est pas propose a l import
       par le carnet d adresses. L e-mail et le telephone sont les deux champs
       pour lesquels on echange une carte : les omettre rendait le fichier
       inutile. Les lignes sont jointes par un CR LF construit a l execution. */
    const FL = String.fromCharCode(13, 10);
    const mail = moi.nom.toLowerCase().split(" ").join(".")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "") + "@bincham.com";
    telecharger("carte-" + S.me + ".vcf", [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + moi.nom.split(" ")[1] + ";" + moi.nom.split(" ")[0],
      "FN:" + moi.nom,
      "ORG:Bincham Industries",
      "TITLE:" + moi.role,
      "EMAIL;TYPE=WORK:" + mail,
      "TEL;TYPE=WORK,VOICE:+33 1 84 80 12 40",
      "URL:" + QRDATA[S.me].url,
      "END:VCARD", ""
    ].join(FL));
    return;
  }

  /* --- filtres et tri --- */
  if ((el = near("[data-fc]"))) {
    const k = el.dataset.fc, v = el.dataset.v;
    S.fCarnet[k] = (S.fCarnet[k] === v) ? null : v;
    rendreEnGardantLeFocus(); return;
  }
  if (near("#fc-clear")) {
    S.fCarnet = { salon:null, source:null, statut:null, opportunite:null };
    S.qCarnet = ""; render(); return;
  }
  if (near("#btn-export-carnet")) { exporterCarnet(); return; }

  if ((el = near("[data-f]"))) {
    const k = el.dataset.f, v = el.dataset.v;
    S.f[k] = (S.f[k] === v) ? null : v;
    S.sel.clear(); rendreEnGardantLeFocus(); return;
  }
  if (near("#f-clear")) { S.f = { statut:null, commercial:null, pays:null, crm:null, complet:null, jour:null }; S.q = ""; rendreEnGardantLeFocus(); return; }
  if ((el = near("[data-sort]"))) {
    const k = el.dataset.sort;
    if (S.sort.k === k) S.sort.dir = -S.sort.dir; else { S.sort.k = k; S.sort.dir = (k === "score") ? -1 : 1; }
    rendreEnGardantLeFocus(); return;
  }
  if ((el = near("[data-kpi-filtre]"))) {
    let f = {};
    try { f = JSON.parse(el.dataset.kpiFiltre); } catch (e) { f = {}; }
    S.f = { statut:null, commercial:null, pays:null, crm:null, complet:null, jour:null };
    Object.keys(f).forEach(function(k){ S.f[k] = f[k]; });
    S.q = "";
    setView("leads");
    return;
  }

  /* --- sélection --- */
  if ((el = near("[data-check]"))) {
    const id = el.dataset.check;
    if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
    rendreEnGardantLeFocus(); return;
  }
  if (near("#selall")) {
    const rows = (S.view === "mesleads")
      ? leadsFiltres().filter(function(l){ return l.commercial === S.me; })
      : leadsFiltres();
    if (S.sel.size >= rows.length) S.sel.clear();
    else rows.forEach(function(l){ S.sel.add(l.id); });
    rendreEnGardantLeFocus(); return;
  }
  if (near("#btn-desel")) { S.sel.clear(); rendreEnGardantLeFocus(); return; }

  /* --- CRM et exports --- */
  if (near("#btn-push"))     { pousserCRM([...S.sel]); S.sel.clear(); return; }
  if (near("#btn-push-all")) { pousserCRM(S.leads.filter(function(l){ return !l.crm; }).map(function(l){ return l.id; })); return; }
  if (near("#btn-export-sel")) { exporterCSV(S.leads.filter(function(l){ return S.sel.has(l.id); }), "selection"); return; }
  if (near("#btn-export-vue")) {
    const rows = (S.view === "mesleads")
      ? leadsFiltres().filter(function(l){ return l.commercial === S.me; })
      : leadsFiltres();
    exporterCSV(rows, "vue"); return;
  }
  if (near("#btn-export-csv"))  { exporterCSV(S.leads, "complet"); return; }
  if (near("#btn-export-json")) { exporterJSON(S.leads); return; }
  if ((el = near("[data-conf]"))) {
    const b = el.dataset.conf.split("|");
    poserEtatExigence(b[0], b[1]); sauver(); rendreEnGardantLeFocus(); return;
  }
  if (near("[data-conf-reset]")) {
    S.conformite = null; S.dureeMois = null; sauver(); render();
    toast("Registre revenu a ses valeurs de depart."); return;
  }

  if ((el = near("[data-jalon-on]"))) {
    const c = el.dataset.jalonOn;
    reglerJalon(c, "on", sequenceEffective()[c].on ? false : true);
    sauver(); render(); return;
  }
  if (near("[data-seq-reset]")) {
    S.sequence = null; sauver(); render();
    toast("Sequence revenue a son reglage par defaut."); return;
  }

  if ((el = near("[data-budget-reset]"))) {
    reinitialiserBudget(el.dataset.budgetReset);
    sauver(); render(); toast("Budget revenu a sa valeur reelle.");
    return;
  }

  /* --- mapping CRM : retirer, remettre, revenir au defaut --- */
  if ((el = near("[data-mapexclu]"))) {
    const id = el.dataset.mapexclu;
    const actuel = ((S.mapping || {})[S.crmCible] || {})[id] || {};
    retoucherMapping(S.crmCible, id, "exclu", !actuel.exclu);
    sauver(); render();
    toast(actuel.exclu ? "Champ remis dans l export." : "Champ retire de l export.");
    return;
  }
  if ((el = near("[data-mapreset]"))) {
    reinitialiserMapping(el.dataset.mapreset);
    sauver(); render(); toast("Mapping revenu a sa valeur par defaut.");
    return;
  }

  /* --- fusion des doublons --- */
  if ((el = near("[data-fusion]"))) {
    S.fusion = { id:el.dataset.fusion, choix:{} };
    render();
    const p = document.querySelector("[data-fusionner]");
    if (p) p.scrollIntoView({ block:"center", behavior:"smooth" });
    return;
  }
  if ((el = near("[data-fchoix]"))) {
    const b = el.dataset.fchoix.split("|");
    if (!S.fusion) return;
    S.fusion.choix = S.fusion.choix || {};
    S.fusion.choix[b[0]] = b[1];
    rendreEnGardantLeFocus();
    return;
  }
  if ((el = near("[data-fusionner]"))) {
    if (fusionner(el.dataset.fusionner)) { render(); toast("Fiches fusionnees. Une seule reste au carnet."); }
    else toast("Fusion impossible : les deux fiches viennent d editions closes.");
    return;
  }
  if (near("[data-fusion-annuler]")) { S.fusion = null; render(); return; }

  /* --- annuaire : un champ a la fois, ou tous les champs VIDES --- */
  if ((el = near("[data-annu]"))) {
    const bout = el.dataset.annu.split("|");
    const l = byId(S.leads, bout[0]);
    if (l && appliquerProposition(l, bout[1])) {
      sauver(); ouvrirLead(l.id);
      toast("Champ repris de l’annuaire. Origine tracée sur la fiche.");
    }
    return;
  }
  if ((el = near("[data-annu-tout]"))) {
    const l = byId(S.leads, el.dataset.annuTout);
    if (!l) return;
    /* « Tout prendre » ne prend que ce qui est PROPOSABLE, donc jamais un
       champ deja saisi a la main : le bouton ne peut pas ecraser. */
    const r = propositionsAnnuaire(l);
    let n = 0;
    r.propositions.forEach(function(x){
      if (x.etat === "proposable" && appliquerProposition(l, x.cle)) n++;
    });
    if (n) { sauver(); ouvrirLead(l.id); toast(n + " champ" + (n>1?"s":"") + " repris de l’annuaire."); }
    return;
  }

  if ((el = near("[data-push-one]")))   { pousserCRM([el.dataset.pushOne]); fermerDrawer(); return; }
  if ((el = near("[data-export-one]"))) {
    const l = byId(S.leads, el.dataset.exportOne);
    if (l) exporterCSV([l], "lead"); return;
  }

  /* --- panneau latéral --- */
  if ((el = near("[data-open]"))) { ouvrirLead(el.dataset.open); return; }
  if (near("#d-close") || near("#scrim")) { fermerDrawer(); return; }

  /* --- administration --- */
  if ((el = near("[data-req]"))) {
    const c = S.champs.find(function(x){ return x.id === el.dataset.req; });
    if (c) { c.requis = !c.requis; sauver(); rendreEnGardantLeFocus(); }
    return;
  }
  if ((el = near("[data-up]"))) {
    const i = +el.dataset.up;
    if (i > 0) { const a = S.champs; const t = a[i-1]; a[i-1] = a[i]; a[i] = t; sauver(); rendreEnGardantLeFocus(); }
    return;
  }
  if ((el = near("[data-down]"))) {
    const i = +el.dataset.down;
    if (i < S.champs.length - 1) { const a = S.champs; const t = a[i+1]; a[i+1] = a[i]; a[i] = t; sauver(); rendreEnGardantLeFocus(); }
    return;
  }
  if (near("#btn-reset-score")) {
    S.scoring = JSON.parse(JSON.stringify(SCORING));
    recalculer(); sauver(); rendreEnGardantLeFocus(); toast("Modèle de scoring réinitialisé");
    return;
  }
});

/* --- saisies --- */
document.addEventListener("input", function(ev){
  const t = ev.target;

  /* Le nom du champ cible se retouche a la frappe. On NE redessine PAS a
     chaque lettre : le champ perdrait le focus et le curseur reviendrait
     au debut. On enregistre, et l ecran se remet a jour quand on sort. */
  /* Les curseurs de budget : on redessine a chaque mouvement pour que le
     cout par lead suive le geste — c est tout l interet de l ecran — et
     on rend le focus au curseur qu on tient. */
  if (t.dataset && t.dataset.poste) {
    retoucherBudget("wire26", t.dataset.poste, +t.value);
    sauver(); render();
    const n = document.getElementById("poste-" + t.dataset.poste);
    if (n) n.focus();
    return;
  }
  if (t.dataset && t.dataset.duree) {
    S.dureeMois = +t.value; sauver(); render();
    const n = document.getElementById("duree-mois");
    if (n) n.focus();
    return;
  }
  if (t.dataset && t.dataset.jalonJ) {
    reglerJalon(t.dataset.jalonJ, "j", +t.value);
    sauver(); render();
    const n = document.getElementById("j-" + t.dataset.jalonJ);
    if (n) n.focus();
    return;
  }
  if (t.dataset && t.dataset.mapapi) {
    retoucherMapping(S.crmCible, t.dataset.mapapi, "api", t.value.trim());
    sauver();
    return;
  }

  if (t.id === "q-carnet") {
    S.qCarnet = t.value; render();
    const n = document.getElementById("q-carnet");
    if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    return;
  }
  if (t.id === "q") {
    S.q = t.value; S.sel.clear(); render();
    const n = document.getElementById("q");
    if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    return;
  }
  if (t.dataset && t.dataset.kf) {
    // La borne ne re-rend pas a chaque frappe : on ne veut ni perte de focus
    // ni clavier virtuel qui se referme. Seul l etat du bouton est rafraichi.
    S.kiosque.saisie[t.dataset.kf] = (t.type === "checkbox") ? t.checked : t.value;
    majBoutonKiosque();
    return;
  }
  if (t.dataset && t.dataset.fld && S.pdraft) {
    S.pdraft[t.dataset.fld] = t.value;
    S.pdraft.conf[t.dataset.fld] = 1;   // corrigé par un humain : plus aucun doute
    return;
  }
  if (t.dataset && t.dataset.weight != null) {
    S.scoring.criteres[+t.dataset.weight].poids = +t.value;
    recalculer(); sauver(); render();
    const n = document.getElementById("w" + t.dataset.weight);
    if (n) n.focus();
    return;
  }
  if (t.dataset && t.dataset.seuil) {
    S.scoring.seuils[t.dataset.seuil] = +t.value;
    recalculer(); sauver(); render();
    const n = document.getElementById(t.dataset.seuil === "chaud" ? "sc" : "st");
    if (n) n.focus();
    return;
  }
});

document.addEventListener("change", function(ev){
  const t = ev.target;
  if (t.id === "f-pays")   { S.f.pays = t.value || null; S.sel.clear(); render(); return; }
  if (t.id === "f-com")    { S.f.commercial = t.value || null; S.sel.clear(); render(); return; }
  if (t.id === "crm-select"){ S.crmCible = t.value; sauver(); render(); return; }
  if (t.id === "fc-salon")  { S.fCarnet.salon = t.value || null; render(); return; }
  if (t.id === "fc-source") { S.fCarnet.source = t.value || null; render(); return; }
});

document.addEventListener("keydown", function(ev){
  if (ev.key === "Tab") { piegerFocus(ev); return; }
  if (ev.key === "Escape") {
    const d = document.getElementById("drawer");
    if (d && d.classList.contains("open")) { fermerDrawer(); return; }
    if (S.pscreen) { S.pscreen = null; S.pdraft = null; render(); }
  }
});

/* Apres chaque rendu : les compteurs montent, et le Devoilement joue
   s il est arme. */
function cablerVue(){
  animerCompteurs(document.getElementById("main"));
  poserChemin();
  if (S.devoile) jouerDevoilement();
}

/* LE CHEMIN DE FER — le repere chiffre de la gouttiere gauche.
   Il est repose apres chaque filtrage : sur une liste filtree, un repere
   fige au 20e enregistrement d origine ne veut plus rien dire. */
function poserChemin(){
  document.querySelectorAll("#main tbody").forEach(function(tb){
    const lignes = tb.rows;
    for (let i = 0; i < lignes.length; i++) {
      if ((i + 1) % 20 === 0) lignes[i].setAttribute("data-rang", String(i + 1).padStart(3, "0"));
      else lignes[i].removeAttribute("data-rang");
    }
  });
}

/** Active ou desactive le bouton de la borne sans re-rendre l ecran :
 *  un re-rendu ferait perdre le focus et replierait le clavier virtuel. */
function majBoutonKiosque(){
  const b = document.querySelector(".tablettescreen [data-kgo='interet'], .tablettescreen [data-kgo='merci']");
  if (!b) return;
  const v = S.kiosque.saisie;
  const pret = String(v.nom || "").trim() && String(v.email || "").trim() && v.consent;
  b.disabled = !pret;
  const aide = b.parentElement && b.parentElement.querySelector("p");
  if (aide) aide.style.display = pret ? "none" : "";
}

/** Rearmage : la borne revient a l accueil pour le visiteur suivant.
 *  Sans lui, le suivant lirait les coordonnees du precedent. */
let minuterieKiosque = null;
function armerRearmage(){
  clearInterval(minuterieKiosque);
  let reste = 8;
  minuterieKiosque = setInterval(function(){
    reste--;
    const el = document.getElementById("k-compte");
    if (!el) { clearInterval(minuterieKiosque); return; }
    el.textContent = String(reste);
    if (reste <= 0) {
      clearInterval(minuterieKiosque);
      S.kiosque.saisie = {};
      S.kiosque.etape = "accueil";
      render();
    }
  }, 1000);
}
