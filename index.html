<title>BinchamCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=Instrument+Sans:wght@400..700&family=DM+Mono:wght@300;400;500&display=swap">
<style>
/* ============================================================
   BinchamCard — identité « LE STUDIO / Vermillon 25 ».

   BinchamCard n'est pas un logiciel : c'est l'instrument de mesure d'une
   journée de salon. On l'habille comme un fabricant d'instruments habille
   un appareil — une coque blanche continue, une géométrie exacte, et une
   seule touche vermillon dans tout l'appareil.

   Le luxe numérique ne vient pas de l'ornement. Il vient de trois choses
   mesurables :
     — la RARETÉ de la couleur : un seul accent, une occurrence par écran ;
     — la PRÉCISION du trait : deux gris de trait, jamais un troisième ;
     — la LENTEUR MAÎTRISÉE du mouvement.

   Une seule élévation existe dans tout le produit. Rien ne flotte.
   Ce qui se manipule est CREUSÉ dans la coque, pas posé dessus.
   ============================================================ */

:root{
  /* ---- trois plans, jamais plus ---- */
  --blanc:#FFFFFF;      /* PLAN 0 — la coque : le sol, il porte le texte et les tableaux */
  --creux:#F1F3F4;      /* PLAN -1 — la poche fraisée : ce qui se manipule */
  --piste:#E9ECEE;      /* PLAN -2 — la piste : fond des mesures, jamais fond de bloc */

  --encre:#101114;      /* texte principal, chiffres, valeur parcourue */
  --encre2:#5A5F66;     /* texte secondaire */
  --encre3:#63686F;     /* légendes, unités, horodatages.
                           Valeur SURE : 5,61:1 sur la coque, 5,04:1 sur le creux.
                           #6B7079 serait plus doux sur blanc mais tombe a 4,47:1
                           sur un creux — un echec de 0,03 qu il faudrait penser
                           a rattraper composant par composant. */
  --encre3c:#63686F;

  --joint:#E3E5E8;      /* trait DÉCORATIF de 1 px — ne porte jamais de sens */
  --arete:#8A9099;      /* trait FONCTIONNEL de 1 px — délimite une commande (1.4.11) */

  --verm:#FF4D00;       /* L'UNIQUE accent. Une occurrence visible par écran. */
  --verm-e:#C42B00;     /* dérogation : seule forme colorée autorisée pour un texte */
  --survol:#F7F8F9;

  /* ---- géométrie : des rayons réels, pas des angles vifs ---- */
  --r-touche:4px;
  --r-coque:14px;
  --r-rond:999px;

  /* ---- écart : unité 4 px, grille de coque 8 px ---- */
  --u1:4px; --u2:8px; --u3:12px; --u4:16px; --u5:20px;
  --u6:24px; --u7:32px; --u8:48px; --u9:64px; --u10:96px;

  --f-titre:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-ui:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SFMono-Regular',monospace;

  --sortie:cubic-bezier(.16,1,.3,1);
  --meca:cubic-bezier(.22,1,.36,1);
  --ease:cubic-bezier(.16,1,.3,1);

  /* ---- L'UNIQUE relief du produit : la feuille transitoire.
         Ombre courte, dure, décalée vers le bas, doublée d'une arête.
         Jamais un halo diffus centré. ---- */
  --feuille:0 0 0 1px #D7DBE0, 0 1px 0 rgba(16,17,20,.04), 0 12px 28px -14px rgba(16,17,20,.22);

  /* ---- passerelle : les anciens noms pointent sur la nouvelle palette ---- */
  --plan:var(--blanc); --plaque:var(--creux); --plaque-2:var(--piste);
  --bg:var(--blanc); --bg-2:var(--blanc); --bg-3:var(--creux); --bg-glass:var(--blanc);
  --line:var(--joint); --line-2:var(--arete);
  --filet-fin:var(--joint); --filet-porteur:var(--arete); --trait-porteur:1px;
  --ink:var(--encre); --ink-2:var(--encre2); --ink-3:var(--encre3); --ink-4:var(--encre3);
  --encre-2:var(--encre2); --encre-3:var(--encre3);
  --accent:var(--verm-e); --accent-ink:var(--verm-e); --accent-bg:var(--creux);
  --accent-solid:var(--verm); --on-accent:var(--encre);
  --minium:var(--verm); --sur-minium:var(--encre);
  --strong:var(--encre); --strong-2:var(--encre); --on-strong:var(--blanc);
  --strong-ov:transparent; --strong-ov-2:transparent;
  --strong-line:var(--blanc); --strong-line-2:var(--blanc);
  --hot:var(--encre); --hot-bg:var(--creux);
  --warm:var(--encre); --warm-bg:var(--creux); --warm-line:var(--arete); --warm-soft:var(--creux);
  --cold:var(--encre3); --cold-bg:var(--creux);
  --ok:var(--encre); --ok-bg:var(--creux); --ok-line:var(--arete);
  --jade:var(--verm-e); --jade-vif:var(--verm); --jade-texte:var(--verm-e);
  --jade-fond:var(--creux); --jade-clair:var(--creux); --jade-sombre:var(--creux);
  --f-fond:var(--blanc); --f-surface:var(--creux); --f-haute:var(--piste);
  --f-bord:var(--joint); --f-texte:var(--encre); --f-texte-2:var(--encre2); --f-texte-3:var(--encre3);
  --shadow-sm:none; --shadow-md:none; --shadow-lg:var(--feuille);
  color-scheme:light;   /* une seule ambiance : la claire */
  --r:var(--r-touche); --r-lg:var(--r-coque);
  --trame:36px;
  --hachure-45:repeating-linear-gradient(45deg,var(--arete) 0 1px,transparent 1px 6px);
  --hachure-fine:repeating-linear-gradient(45deg,var(--arete) 0 1px,transparent 1px 6px);
}


/* ============================================================
   Reset
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--blanc);color:var(--encre);
  font:400 15px/1.5 var(--f-ui);letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--encre);outline-offset:2px;border-radius:var(--r-touche)}
p{margin:0}
h1{font-family:var(--f-titre);font-weight:500;font-size:38px;line-height:1.08;letter-spacing:-.024em;margin:0}
h2{font-family:var(--f-titre);font-weight:500;font-size:24px;line-height:1.16;letter-spacing:-.018em;margin:0}
h3{font-family:var(--f-ui);font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.012em;margin:0}
h4{font-family:var(--f-ui);font-weight:600;font-size:15px;line-height:1.3;margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.eyebrow,.navgroup,.sechead,.cote__val{
  font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--encre3)
}
.estampille,.mono{font:400 13px/1.2 var(--f-mono);color:var(--encre3);font-variant-numeric:tabular-nums}

/* ============================================================
   Le châssis — l'application occupe exactement l'écran
   ============================================================ */
.app{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.topbar{
  flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;height:56px;
  background:var(--blanc);border-bottom:1px solid var(--joint)
}
.brand{display:flex;align-items:center;gap:10px;
  font-family:var(--f-titre);font-weight:600;font-size:20px;letter-spacing:-.02em}
.brand svg{display:block}
.spacer{flex:1}

.roleswitch{
  display:inline-flex;padding:3px;gap:3px;background:var(--creux);
  border-radius:6px;box-shadow:inset 0 1px 0 #DDE1E4
}
.roleswitch button{
  height:30px;padding:0 12px;border-radius:var(--r-touche);
  font:500 13px/1 var(--f-ui);color:var(--encre3c);white-space:nowrap;
  transition:background 180ms var(--sortie),color 180ms var(--sortie)
}
.roleswitch button:hover{color:var(--encre)}
.roleswitch button[aria-pressed="true"]{
  background:var(--blanc);color:var(--encre);font-weight:600;box-shadow:0 0 0 1px var(--joint)
}
.roleswitch button:active{transform:translateY(1px)}

.layout{display:flex;flex:1;min-height:0}
.sidenav{
  width:232px;flex:none;padding:16px 12px;border-right:1px solid var(--joint);
  background:var(--blanc);display:flex;flex-direction:column;gap:2px;overflow-y:auto
}
.navgroup{padding:8px 12px}
.navitem{
  display:flex;align-items:center;gap:12px;padding:0 12px;height:40px;width:100%;
  border-radius:var(--r-touche);font:500 15px/1 var(--f-ui);letter-spacing:-.008em;
  color:var(--encre2);text-align:left;
  transition:background 180ms var(--sortie),color 180ms var(--sortie)
}
.navitem:hover{background:var(--survol);color:var(--encre)}
.navitem[aria-current="page"]{background:var(--creux);color:var(--encre);font-weight:600}
.navitem svg{flex:none;opacity:.6}
.navitem[aria-current="page"] svg{opacity:1}
.navitem .badge{margin-left:auto;font:400 13px/1 var(--f-mono);color:var(--encre3);font-variant-numeric:tabular-nums}

.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--blanc)}
.page{padding:32px 24px 96px;max-width:1440px;margin:0 auto}
.pagehead{margin-bottom:32px;max-width:80ch}
.pagehead h1{margin-top:8px}
.pagehead p{margin-top:12px;color:var(--encre2);max-width:72ch;font-size:15px;line-height:1.55}

.cote{position:relative;height:0;margin:48px 0 20px;border-top:1px solid var(--joint)}
.cote::before,.cote::after{display:none}
.cote__val{position:absolute;top:-6px;left:0;padding:0 12px 0 0;background:var(--blanc);color:var(--encre3)}
.cote__val b{color:var(--encre);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
</style>
<style>
/* ============================================================
   La touche — sérigraphiée. La légende est NOIRE sur vermillon
   (5,55:1) : le blanc y serait illisible.
   ============================================================ */
.btn,.btn-primary,.btn-accent,.btn-ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:36px;padding:0 14px;border:0;border-radius:var(--r-touche);
  font:600 15px/1 var(--f-ui);letter-spacing:-.008em;
  transition:background 180ms var(--sortie),transform 90ms var(--sortie),box-shadow 180ms var(--sortie)
}
/* legende NOIRE sur vermillon dans les DEUX themes : le vermillon ne
   change pas d un theme a l autre, la legende ne doit donc pas changer. */
.btn-primary,.btn-accent{background:var(--verm);color:#101114}
.btn-primary:hover,.btn-accent:hover{background:#F04600}
.btn-ghost{background:var(--blanc);color:var(--encre);box-shadow:inset 0 0 0 1px var(--arete)}
.btn-ghost:hover{background:var(--creux)}
.btn:active,.btn-primary:active,.btn-accent:active,.btn-ghost:active{transform:translateY(1px)}
.btn-sm{height:30px;padding:0 12px;font-size:13px}
.btn:disabled,.btn-primary:disabled,.btn-accent:disabled,.btn-ghost:disabled{
  background:var(--creux);color:var(--encre3c);box-shadow:inset 0 0 0 1px var(--joint);
  cursor:not-allowed;transform:none
}
.btn svg,.btn-primary svg,.btn-ghost svg,.btn-accent svg{flex:none}

.card{background:var(--blanc);border:0;box-shadow:none;border-radius:var(--r-coque)}
.card-p{padding:20px 0 32px}
.encart--plaque,.card.encart--plaque{
  background:var(--creux);border-radius:var(--r-coque);box-shadow:inset 0 1px 0 #DDE1E4;padding:20px
}

/* ---- statut : forme + texte, jamais le ton seul ---- */
.tag{
  display:inline-flex;align-items:center;gap:7px;
  font:500 13px/1 var(--f-ui);color:var(--encre);white-space:nowrap;
  padding:5px 10px;border-radius:var(--r-touche);background:var(--creux)
}
.tag::before{content:'';width:8px;height:8px;flex:none;background:var(--encre);border-radius:var(--r-rond)}
.t-warm::before{border-radius:1px;transform:rotate(45deg);width:7px;height:7px}
.t-cold::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--encre3)}
.t-neutral{color:var(--encre2);background:transparent;box-shadow:inset 0 0 0 1px var(--joint)}
.t-neutral::before{display:none}
.dot{display:none}

.avatar{
  width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:var(--r-touche);
  font:500 11px/1 var(--f-ui);background:var(--creux);color:var(--encre2)
}

/* ---- le champ : une poche fraisée ---- */
.field > span{display:block;font:600 11px/1 var(--f-ui);letter-spacing:.06em;
  text-transform:uppercase;color:var(--encre3c);margin-bottom:8px}
.input,select.input{
  width:100%;height:44px;padding:0 12px;background:var(--creux);color:var(--encre);
  border:0;border-radius:var(--r-touche);
  box-shadow:inset 0 0 0 1px var(--arete),inset 0 1px 0 #DDE1E4;
  font:400 15px/44px var(--f-ui);
  transition:box-shadow 180ms var(--sortie),background 180ms var(--sortie)
}
.input::placeholder{color:var(--encre3c)}
.input:hover{background:#EDEFF1}
.input:focus{background:var(--blanc);outline:0;
  box-shadow:inset 0 0 0 1px var(--encre),0 0 0 2px var(--blanc),0 0 0 4px rgba(16,17,20,.14)}
@media (max-width:760px){ .input,select.input,.search input,.cfield input{font-size:16px} }
</style>
<style>
/* ============================================================
   La bande d'indicateurs — cinq cases d'un même instrument,
   jamais cinq tuiles identiques.
   ============================================================ */
.kpigrid{
  display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;
  background:var(--blanc);border-top:1px solid var(--joint);border-bottom:1px solid var(--joint)
}
.kpi,button.kpi{
  padding:20px 24px 20px 0;display:flex;flex-direction:column;gap:8px;
  background:none;border:0;text-align:left;min-height:96px;
  /* Sans min-width:0 la colonne 1fr prend la largeur intrinseque du
     nombre : deux colonnes deviennent inegales et debordent. */
  min-width:0
}
.kpigrid > * + *{border-left:1px solid var(--joint);padding-left:24px}
button.kpi{width:100%;font:inherit;cursor:pointer;border-radius:0;transition:background 180ms var(--sortie)}
button.kpi:hover{background:var(--survol)}
.kpi .lbl{font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;
  color:var(--encre3);display:flex;align-items:center;gap:6px}
.kpi .val{font:400 38px/1 var(--f-mono);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums lining-nums;margin-top:auto;color:var(--encre)}
.kpigrid > :first-child .val{font-size:48px}
.kpi .val small{font-size:20px;color:var(--encre3)}
.kpi .sub{font:400 13px/1.35 var(--f-ui);color:var(--encre2)}
.kpi-fleche{color:var(--verm-e);font-weight:700}
.trend-up,.trend-down{color:var(--encre2)}

/* ============================================================
   Graphiques — la piste, l'encre, et rien d'autre
   ============================================================ */
.chartgrid{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.chartgrid.g-2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.chartgrid.g-2-etroit{grid-template-columns:minmax(0,1.3fr) minmax(0,320px)}
.chartgrid.g-carte{grid-template-columns:minmax(0,340px) minmax(0,1fr)}
.chartgrid.g-auto{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media (max-width:900px){
  .chartgrid,.chartgrid.g-2,.chartgrid.g-2-etroit,.chartgrid.g-carte{grid-template-columns:minmax(0,1fr)}
}
.chart{background:none;border:0;padding:24px 0 8px;min-width:0}
.chart h3{font-family:var(--f-titre);font-weight:500;font-size:24px;letter-spacing:-.018em}
.chart .hint{font-size:13px;line-height:1.45;color:var(--encre2);margin-top:6px;max-width:62ch}
.chart .body{margin-top:20px;overflow-x:auto}
.bars{display:flex;flex-direction:column}
.barrow{display:grid;grid-template-columns:180px 1fr 72px;align-items:center;gap:16px;
  height:44px;border-bottom:1px solid var(--joint);font-size:13px}
.barrow:last-child{border-bottom:0}
.barrow .lb{color:var(--encre2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bartrack{height:10px;background:var(--piste);border-radius:1px}
.barfill{display:block;height:10px;background:var(--encre)!important;border-radius:1px;
  transition:width 480ms var(--meca)}
.barrow .vv{text-align:right;font:400 13px/1 var(--f-mono);color:var(--encre);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;font:400 13px/1 var(--f-ui);color:var(--encre2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;display:block;background:var(--encre);border-radius:1px}

/* ============================================================
   Tableau dense — tenue à 200 lignes
   ============================================================ */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--encre3c)}
.search input{
  width:100%;height:36px;padding:0 12px 0 34px;background:var(--creux);color:var(--encre);
  border:0;border-radius:var(--r-touche);
  box-shadow:inset 0 0 0 1px var(--arete),inset 0 1px 0 #DDE1E4;font-size:13px
}
.search input:focus{background:var(--blanc);outline:0;box-shadow:inset 0 0 0 1px var(--encre)}
.chipbar{display:inline-flex;padding:3px;gap:3px;background:var(--creux);border-radius:6px;
  box-shadow:inset 0 1px 0 #DDE1E4;flex-wrap:wrap}
.chip{
  height:30px;padding:0 12px;border-radius:var(--r-touche);
  font:500 13px/1 var(--f-ui);color:var(--encre3c);
  transition:background 180ms var(--sortie),color 180ms var(--sortie)
}
.chip:hover{color:var(--encre)}
.chip[aria-pressed="true"]{background:var(--blanc);color:var(--encre);font-weight:600;box-shadow:0 0 0 1px var(--joint)}

.tablewrap{background:var(--blanc);border:0;border-radius:var(--r-coque);
  box-shadow:inset 0 0 0 1px var(--joint);overflow:hidden}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:400 13px/1.35 var(--f-ui);min-width:860px}
th{
  position:sticky;top:0;z-index:2;height:40px;background:var(--creux);color:var(--encre3c);
  font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;text-align:left;
  padding:0 12px;border-bottom:1px solid var(--arete);white-space:nowrap
}
th.sortable{padding:0;color:var(--encre)}
.th-tri{display:flex;align-items:center;gap:6px;width:100%;height:40px;padding:0 12px;
  font:inherit;color:inherit;text-align:left;transition:background 180ms var(--sortie)}
.th-tri:hover{background:#E9ECEE}
.th-fleche{font-size:11px;min-width:8px;color:var(--verm-e)}
td{padding:0 12px;height:36px;border-bottom:1px solid var(--joint);vertical-align:middle}
tbody tr{transition:background 120ms var(--sortie)}
tbody tr:hover{background:var(--survol);box-shadow:inset 2px 0 0 var(--arete)}
tbody tr.sel{background:var(--creux);box-shadow:inset 2px 0 0 var(--verm)}
tbody tr:last-child td{border-bottom:0}
.cellname{font-weight:600;color:var(--encre);text-align:left;letter-spacing:-.008em}
.cellsub{font:400 11px/1.3 var(--f-ui);color:var(--encre3);margin-top:2px}
.scorebadge{display:inline-flex;align-items:center;gap:8px}
.scorebadge b{font:400 13px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.scorebar{width:44px;height:8px;background:var(--piste);border-radius:1px;flex:none}
.scorebar i{display:block;height:8px;background:var(--encre)!important;border-radius:1px}
.empty{padding:96px 0;text-align:center;color:var(--encre2)}
.empty h3{font-family:var(--f-titre);font-weight:500;font-size:24px;color:var(--encre);
  margin-bottom:8px;letter-spacing:-.018em}
.empty p{font-size:13px;max-width:48ch;margin:0 auto}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px;background:var(--creux);border-top:1px solid var(--joint);
  font:400 13px/1 var(--f-ui);color:var(--encre3c);flex-wrap:wrap}

.selbar{
  position:sticky;bottom:16px;z-index:30;margin:16px auto 0;max-width:640px;
  display:flex;align-items:center;gap:16px;padding:10px 12px 10px 16px;
  background:var(--blanc);color:var(--encre);border-radius:var(--r-coque);
  box-shadow:var(--feuille);font:500 13px/1 var(--f-ui)
}
.selbar .btn-ghost{box-shadow:inset 0 0 0 1px var(--arete)}
</style>
<style>
/* ============================================================
   L'appareil — un boîtier fraisé, pas la photo d'un téléphone.
   Rayon de coque 14 px, une seule élévation, aucune encoche.
   ============================================================ */
/* L ordre des pistes suit l ordre du balisage : l APPAREIL est premier.
   Il prend donc la piste auto, dimensionnee sur sa largeur calculee ;
   le texte prend le reste. Inverser les deux donnait a l appareil une
   piste souple ecrasee par le max-content du texte : la borne sortait
   de sa colonne et recouvrait la navigation. */
.terrainwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:start}
.phoneside{position:sticky;top:24px;display:flex;justify-content:center}
/* L appareil ne se laisse pas comprimer : sans flex:none, le conteneur le
   retrecit et le rapport de forme est perdu. */
.phone,.tablette{flex:none}
/* L'appareil dérive sa taille de la hauteur RÉELLEMENT disponible, jamais
   d'une valeur fixe : sur un portable 13 pouces comme sur un 27 pouces, il
   doit tenir entier sans que le déclencheur soit coupé. La largeur suit le
   rapport de forme, elle n'est jamais imposée. */
/* ============================================================
   L APPAREIL EST RENDU A SA RESOLUTION LOGIQUE REELLE.

   Le piege evite ici : reduire la largeur du cadre pour le faire tenir
   dans l ecran revient a rendre l interface dans 328 px au lieu de 402.
   Les titres se coupent, la barre d onglets deborde, l ascenseur
   apparait — on ne regarde plus un iPhone, on regarde une maquette
   ecrasee.

   L ecran garde donc TOUJOURS ses dimensions reelles, et c est le tout
   qui est reduit optiquement par un transform : exactement ce que fait
   l oeil devant un vrai telephone pose plus loin.

     iPhone 17 Pro   ecran 402 x 874 pt, lunette 12 pt  -> 426 x 898
     iPad Pro 11     ecran 834 x 1194 pt, lunette 24 pt -> 882 x 1242

   --k est pose par poserEchelle() depuis la hauteur reellement libre.
   ============================================================ */
/* --l et --h sont portes par l ENVELOPPE, pas par l appareil : une
   variable descend, elle ne remonte pas. Declarees sur .phone, elles
   restaient invisibles au calc() de l enveloppe, dont la largeur
   retombait sur auto — le cadre gardait alors sa taille reelle a
   l ecran au lieu d etre reduit. */

  --k:1;
  width:calc(var(--l) * var(--k));
  height:calc(var(--h) * var(--k));
  flex:none;position:relative
}
.appareil.tel{   --l:426px; --h:898px }
.appareil.borne{ --l:882px; --h:1242px }
.appareil > *{transform:scale(var(--k));transform-origin:top left}

.phone{

  width:426px;height:898px;padding:12px;

/* ============================================================

   C'est ici que vit le détail. Ce sont ces trois objets qui font qu'on
   reconnaît le produit sur une capture figée, sans logo et sans légende.
   ============================================================ */

/* ------------------------------------------------------------
   SIGNATURE 1 — LE CHÂSSIS FRAISÉ
   Il n'y a pas de carte. On fraise des poches dans un plan blanc au lieu
   d'empiler des rectangles arrondis. Le jeu de rayons encode la nature de
   l'objet : 0 le plan, 4 ce qui se manipule, 14 l'appareil, 999 l'état.

   SIGNATURE 2a — LE VERNIER
   Partout où un logiciel met une barre arrondie avec un dégradé, on pose

   les 30 px, une aiguille vermillon à la valeur, et un trait d'encre à

}

.vernier-valeur{
  position:absolute;top:0;left:0;height:8px;width:var(--pct,0%);background:var(--encre);
  border-radius:1px;transition:width 480ms var(--meca)
}
.vernier-aiguille{
  position:absolute;top:-3px;left:var(--pct,0%);width:2px;height:14px;background:var(--verm);
  transform:translateX(-1px);transition:left 480ms var(--meca)
}
.vernier-cible{position:absolute;top:-3px;left:var(--cible,100%);width:1px;height:14px;background:var(--encre)}
.vernier-pied{display:flex;justify-content:space-between;margin-top:8px;
  font:400 11px/1 var(--f-mono);color:var(--encre3);font-variant-numeric:tabular-nums}

/* La jauge existante devient un vernier : une seule règle, partout. */
.jauge{
  height:22px;background:
    repeating-linear-gradient(90deg,var(--arete) 0 1px,transparent 1px 6px)  bottom/100% 6px  no-repeat,
    repeating-linear-gradient(90deg,var(--arete) 0 1px,transparent 1px 30px) bottom/100% 10px no-repeat;
  border-radius:0;position:relative
}
.jauge::before{content:'';position:absolute;inset:0 0 auto;height:8px;background:var(--piste);border-radius:1px}
.jauge > i{
  position:relative;display:block;height:8px;background:var(--encre);border-radius:1px;
  transition:width 480ms var(--meca)
}
.jauge > i::after{
  content:'';position:absolute;right:-1px;top:-3px;width:2px;height:14px;background:var(--verm)
}

/* ------------------------------------------------------------
   SIGNATURE 2b — LE CHEMIN DE FER
   Aucune zébrure : à 200 lignes, un fond alterné crée un moiré et fatigue.
   La lecture tient par la graduation — l'œil compte par 5 et se repère
   par 20, exactement comme sur un cadran de minutes.
   ------------------------------------------------------------ */
tbody td{position:relative;border-bottom:1px solid var(--joint)}
tbody tr:nth-child(5n) td{border-bottom-color:#CBD0D6}
tbody tr:nth-child(20n) td{border-bottom-color:var(--arete)}
tbody tr[data-rang] td:first-child::before{
  content:attr(data-rang);position:absolute;left:-34px;width:28px;text-align:right;
  font:400 11px/36px var(--f-mono);color:var(--encre3);font-variant-numeric:tabular-nums;
  pointer-events:none
}
/* la gouttière gauche accueille le repère chiffré */
.tscroll{padding-left:36px}
.tscroll table{margin-left:-2px}
/* survol asymétrique : instantané sous le curseur, sans clignotement au balayage */
tbody tr{transition:background 0ms}
tbody tr:not(:hover){transition:background 140ms var(--sortie)}

/* densité : le carnet et les listes longues respirent en trois crans */
.dense-compact td{height:32px}
.dense-standard td{height:36px}
.dense-confort td{height:44px}

/* ------------------------------------------------------------
   SIGNATURE 3 — LE FILET D'ACTE
   La récompense du Dévoilement. L'aiguille dépasse de trois points puis
   se recale — c'est le geste d'un instrument, pas d'une animation d'écran.
   Un filet vermillon de 1 px se trace sous le score, vire au gris, et
   RESTE GRAVÉ : la trace de l'acte demeure quand la couleur s'est éteinte.
   ------------------------------------------------------------ */
.acte{position:relative;display:inline-block}
.acte::after{
  content:'';position:absolute;left:0;bottom:-10px;height:1px;width:0;
  background:var(--verm);
  transition:width 240ms var(--meca), background-color 600ms linear 140ms
}
.acte.trace::after{width:100%;background:var(--arete)}
@media (prefers-reduced-motion:reduce){
  .acte::after{transition:none}
  .acte.trace::after{width:100%;background:var(--arete)}
}

/* le score du Dévoilement : LCD, chasse fixe, très fin */
.dev-score{font:300 96px/1 var(--f-mono);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--encre);display:block}
.dev-sur{font:400 20px/1 var(--f-mono);color:var(--encre3)}

/* ------------------------------------------------------------
   La gouttière d'état — greffe LA MAISON.
   Un objet qui demande une action porte une gouttière de 44 px à gauche,
   jamais un fond coloré. L'état se lit au bord, pas au remplissage.
   ------------------------------------------------------------ */
.gouttiere{position:relative;padding-left:44px}
.gouttiere::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:calc(100% - 16px);background:var(--arete)
}
.gouttiere--agir::before{background:var(--verm)}
.gouttiere__marque{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font:400 11px/1 var(--f-mono);color:var(--encre3);font-variant-numeric:tabular-nums
}

/* ------------------------------------------------------------
   Micro-détails — l'esprit du détail se voit ici et nulle part ailleurs.
   ------------------------------------------------------------ */
/* toute commande s'enfonce de 1 px sous le doigt, en 90 ms */
.navitem:active,.chip:active,.qchip:active,.prow:active,.fieldrow:active,.pouls .pl:active{
  transform:translateY(1px)
}
/* les chiffres ne sautent jamais de largeur pendant qu'ils montent */
.val,.vv,.herostats b,.scorebadge b,.kpi .val{font-variant-numeric:tabular-nums lining-nums}
/* le trait sous un lien se trace, il n'apparaît pas */
.hero .link{position:relative}
.hero .link::after{content:'';position:absolute;left:8px;right:8px;bottom:4px;height:1px;
  background:var(--verm);transform:scaleX(0);transform-origin:left;
  transition:transform 240ms var(--meca)}
.hero .link:hover::after{transform:scaleX(1)}
/* une seule occurrence de vermillon par écran : le reste du produit est monochrome */
@keyframes bc-monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bc-pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bc-onde{0%{transform:scale(.6);opacity:.35}100%{transform:scale(2.2);opacity:0}}
.bc-monte{animation:bc-monte 240ms var(--sortie) both}
.bc-pop{animation:bc-pop 240ms var(--meca) both}
.bc-cascade > *{animation:bc-monte 240ms var(--sortie) both}
.bc-cascade > *:nth-child(1){animation-delay:0ms}
.bc-cascade > *:nth-child(2){animation-delay:40ms}
.bc-cascade > *:nth-child(3){animation-delay:80ms}
.bc-cascade > *:nth-child(4){animation-delay:120ms}
.bc-cascade > *:nth-child(5){animation-delay:160ms}
.bc-cascade > *:nth-child(6){animation-delay:200ms}
.bc-cascade > *:nth-child(7){animation-delay:240ms}
.bc-cascade > *:nth-child(8){animation-delay:280ms}
.bc-appui{transition:transform 90ms var(--sortie)}
.bc-appui:active{transform:translateY(1px)}
.bc-vivant{display:inline-block;width:6px;height:6px;border-radius:var(--r-rond);
  background:var(--verm);position:relative;flex:none}
.bc-vivant::after{content:'';position:absolute;inset:0;border-radius:var(--r-rond);
  background:var(--verm);animation:bc-onde 2s var(--sortie) infinite}
.bc-onde-libre{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:var(--r-rond);
  background:radial-gradient(circle,rgba(255,77,0,.45) 0%,rgba(255,77,0,0) 70%);
  pointer-events:none;z-index:90;animation:bc-onde .7s var(--sortie) both}
.bc-anneau{display:block}
.bc-reflet{position:relative}
.bc-face-cachee{
  background:rgba(255,255,255,.06);border-radius:var(--r-touche);padding:12px 20px;text-align:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)
}
@media (prefers-reduced-motion:reduce){
  .bc-monte,.bc-pop,.bc-cascade > *{animation:none!important;opacity:1!important;transform:none!important}
  .bc-vivant::after,.bc-onde-libre{animation:none!important;opacity:0!important}
  .bc-appui:active,.navitem:active,.chip:active,.qchip:active,.prow:active{transform:none}
  .hero .link::after{transition:none}
}

/* ------------------------------------------------------------
   La bascule d'encre tertiaire.
   #6B7079 tombe a 4,47:1 sur un fond creux — echec de 0,03. Toute
   surface creusee redefinit donc le token, et la regle s'applique
   partout sans que chaque composant ait a y penser.
   ------------------------------------------------------------ */
.pcard,.fraise,.creux,.encart--plaque,.cfield,.input,.search input,
.kfield input,.chipbar,.roleswitch,.tfoot,.dfoot,th{
  --encre3:var(--encre3c)
}

/* ------------------------------------------------------------
   LA RÈGLE DU RAYON — le rayon encode la nature de l'objet, il n'est
   jamais un effet de style. Le rond intégral est réservé à DEUX objets
   dans tout le produit : le point d'état de 8 px, et le déclencheur du
   viseur, qui est un bouton physique. Partout ailleurs, un rayon de
   pilule sur un élément de contenu est le signe d'une interface
   fabriquée sans intention.
   ------------------------------------------------------------ */
.tag::before,.statut::before,.bc-vivant,.shutter{border-radius:var(--r-rond)}
.toast::before{border-radius:1px}

/* ============================================================
   Moteur d'animation — écrit à la main, sans bibliothèque.

   Trois primitives suffisent à tout le reste de l'interface :
   un compteur qui monte, une jauge qui se remplit, une célébration.
   Chacune respecte prefers-reduced-motion en arrivant directement
   à l'état final : l'information n'est jamais portée par le mouvement.
   ============================================================ */
const MOUVEMENT_REDUIT = (function(){
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch (e) { return false; }
})();

/** Décélération franche : rapide au départ, presque arrêtée à la fin.
 *  C'est la courbe qui donne l'impression que le chiffre « atterrit ». */
function easeSortie(t){ return 1 - Math.pow(1 - t, 4); }

/**
 * Fait monter un nombre jusqu'à sa valeur, dans l'élément donné.
 * L'élément porte sa valeur finale en attribut dès le premier rendu,
 * donc un lecteur d'écran lit toujours le bon chiffre.
 */
function animerNombre(el, vers, duree, suffixe){
  if (!el) return;
  const fin = Number(vers) || 0;
  const suf = suffixe || "";
  if (MOUVEMENT_REDUIT) { el.textContent = nf.format(fin) + suf; return; }
  const depart = Number(String(el.dataset.valeur || "0").replace(/\s/g, "")) || 0;
  if (depart === fin) { el.textContent = nf.format(fin) + suf; return; }
  const d = duree || 620;
  const t0 = performance.now();
  el.dataset.valeur = String(fin);
  (function pas(t){
    const p = Math.min(1, (t - t0) / d);
    const v = Math.round(depart + (fin - depart) * easeSortie(p));
    el.textContent = nf.format(v) + suf;
    if (p < 1) requestAnimationFrame(pas);
    else el.textContent = nf.format(fin) + suf;
  })(t0);
}

/** Anime tous les compteurs marqués d'un data-compteur présents à l'écran. */
function animerCompteurs(racine){
  const r = racine || document;
  r.querySelectorAll("[data-compteur]").forEach(function(el){
    animerNombre(el, el.dataset.compteur, +(el.dataset.duree || 620), el.dataset.suffixe || "");
  });
}

/**
 * Anneau de progression en SVG.
 * `p` va de 0 à 1. La jauge se remplit depuis son état précédent,
 * ce qui rend le gain visible plutôt que déjà acquis.
 */
function anneau(p, taille, epaisseur, couleur, fond){
  const t = taille || 96, e = epaisseur || 9;
  const r = (t - e) / 2, c = 2 * Math.PI * r;
  const dec = c * (1 - clamp(p, 0, 1));
  return '<svg width="' + t + '" height="' + t + '" viewBox="0 0 ' + t + ' ' + t + '" aria-hidden="true" class="bc-anneau">' +
    '<circle cx="' + t/2 + '" cy="' + t/2 + '" r="' + r + '" fill="none" stroke="' + (fond || "var(--bg-3)") + '" stroke-width="' + e + '"/>' +
    '<circle cx="' + t/2 + '" cy="' + t/2 + '" r="' + r + '" fill="none" stroke="' + (couleur || "var(--encre)") + '" ' +
      'stroke-width="' + e + '" stroke-linecap="butt" stroke-dasharray="' + c.toFixed(2) + '" ' +
      'stroke-dashoffset="' + dec.toFixed(2) + '" transform="rotate(-90 ' + t/2 + ' ' + t/2 + ')" ' +
      'style="transition:stroke-dashoffset .9s var(--sortie)"/>' +
  '</svg>';
}

/**
 * Célébration : une onde jade qui part du centre de l'élément visé,
 * puis disparaît. Elle ne bloque rien et ne demande aucune action.
 * Le commercial repart pendant qu'elle joue.
 */
function celebrer(cible, intensite){
  if (MOUVEMENT_REDUIT || !cible) return;
  const b = cible.getBoundingClientRect();
  const n = intensite === "forte" ? 3 : 1;
  for (let i = 0; i < n; i++) {
    const o = document.createElement("span");
    o.className = "bc-onde-libre";
    o.style.left = (b.left + b.width / 2) + "px";
    o.style.top = (b.top + b.height / 2) + "px";
    o.style.animationDelay = (i * 130) + "ms";
    document.body.appendChild(o);
    setTimeout(function(){ o.remove(); }, 900 + i * 130);
  }
}

/* ============================================================
   L'ANNUAIRE — compléter une fiche à partir d'une base de sociétés.

   HONNÊTETÉ, EN PREMIER. La base est EMBARQUÉE dans l'application, pas
   interrogée à l'extérieur : un fichier HTML autonome n'a ni serveur ni
   réseau. L'écran le dit à chaque proposition. Ce qui est réel ici,
   c'est le MÉCANISME — normaliser un nom, le rapprocher, proposer champ
   par champ, tracer d'où vient chaque valeur — et c'est justement la
   partie qui fait le produit. Brancher un vrai registre revient à
   remplacer la source de `chercherSociete`, rien d'autre.

   DEUX RÈGLES QUI NE SE NÉGOCIENT PAS.

   1. L'annuaire ne remplit que le VIDE. Il ne remplace jamais une valeur
      saisie par un humain. Une donnée que quelqu'un a tapée en regardant
      son interlocuteur vaut mieux qu'une donnée déduite d'un nom de
      société, toujours.

   2. Rien n'est écrit sans un geste. Chaque champ se prend ou se laisse,
      un par un. Un enrichissement qui s'applique tout seul est un
      enrichissement qu'on ne peut plus auditer.
   ============================================================ */

/* Les formes juridiques ne disent rien de l'identité d'une société : deux
   fiches « Drahtwerk Hoffmann GmbH » et « Drahtwerk Hoffmann » sont la
   même entreprise. On les retire avant de comparer. */
const FORMES_JURIDIQUES = [
  "gmbh & co kg", "gmbh", "ag", "kg", "ohg", "ug",          /* de / at */
  "s.p.a.", "spa", "s.r.l.", "srl", "s.a.s.", "snc",        /* it */
  "s.a.r.l.", "sarl", "s.a.s", "sas", "sa", "eurl", "scop", /* fr */
  "s.l.", "sl", "s.a.", "s.l.u.",                           /* es */
  "a.s.", "as", "ltd sti", "ltd. sti.",                     /* tr */
  "b.v.", "bv", "n.v.", "nv",                               /* nl */
  "sp. z o.o.", "sp z oo", "z o.o.",                        /* pl */
  "s.r.o.", "sro", "a.s",                                   /* cz */
  "ltda", "s/a",                                            /* br */
  "a/s", "aps",                                             /* dk */
  "ltd", "limited", "inc", "inc.", "llc", "corp", "co.", "co", "plc"
];

/** Réduit un nom de société à une clé comparable. */
function cleSociete(nom){
  let s = String(nom || "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")   /* accents */
    .toLowerCase()
    .replace(/[’']/g, " ")
    .replace(/&/g, " et ")
    .replace(/[^a-z0-9\s.]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  /* On retire la forme juridique en fin de nom, et une seule fois : un
     mot comme « as » au milieu d'un nom n'est pas une forme juridique. */
  FORMES_JURIDIQUES.forEach(function(f){
    const fin = " " + f;
    if (s.endsWith(fin)) s = s.slice(0, -fin.length).trim();
  });
  return s.replace(/[.]/g, "").replace(/\s+/g, " ").trim();
}

/** Jaro-Winkler. Il tolère les fautes de frappe et les inversions de
 *  lettres, ce qu'une comparaison stricte ne fait pas — or un nom de
 *  société relevé sur un stand en contient. */
function jaroWinkler(a, b){
  if (a === b) return 1;
  if (!a.length || !b.length) return 0;
  const fenetre = Math.max(0, Math.floor(Math.max(a.length, b.length) / 2) - 1);
  const va = new Array(a.length).fill(false);
  const vb = new Array(b.length).fill(false);
  let m = 0;
  for (let i = 0; i < a.length; i++) {
    const deb = Math.max(0, i - fenetre), fin = Math.min(i + fenetre + 1, b.length);
    for (let j = deb; j < fin; j++) {
      if (vb[j] || a[i] !== b[j]) continue;
      va[i] = true; vb[j] = true; m++; break;
    }
  }
  if (!m) return 0;
  let k = 0, t = 0;
  for (let i = 0; i < a.length; i++) {
    if (!va[i]) continue;
    while (!vb[k]) k++;
    if (a[i] !== b[k]) t++;
    k++;
  }
  t = t / 2;
  const j = (m / a.length + m / b.length + (m - t) / m) / 3;
  /* Bonus de préfixe : les noms de société se ressemblent surtout par le début. */
  let p = 0;
  while (p < 4 && p < a.length && p < b.length && a[p] === b[p]) p++;
  return j + p * 0.1 * (1 - j);
}

const SEUIL_RAPPROCHEMENT = 0.92;   /* en dessous, on ne propose rien */

/** Cherche une société dans l'annuaire. Renvoie la meilleure
 *  correspondance et son score, ou null. */
function chercherSociete(nom, pays){
  const cle = cleSociete(nom);
  if (!cle) return null;
  let meilleur = null;
  (SEED.annuaire || []).forEach(function(e){
    let sc = jaroWinkler(cle, cleSociete(e.nom));
    /* Le pays est un discriminant, pas un critère : deux sociétés au nom
       proche dans deux pays différents ne sont pas la même. */
    if (pays && e.pays && pays !== e.pays) sc -= 0.06;
    if (!meilleur || sc > meilleur.score) meilleur = { fiche:e, score:sc };
  });
  if (!meilleur || meilleur.score < SEUIL_RAPPROCHEMENT) return null;
  return meilleur;
}

/* ============================================================
   La provenance. Chaque valeur porte son origine, et l'origine décide
   qui peut écraser qui.
   ============================================================ */
const RANG_PROVENANCE = { saisie:3, carte:2, borne:3, annuaire:1 };
const NOM_PROVENANCE = {
  saisie:"saisi à la main", carte:"lu sur la carte",
  borne:"saisi par le visiteur", annuaire:"annuaire embarqué"
};

function provenanceDe(l, champ){
  return (l.provenance && l.provenance[champ]) || null;
}
/** Peut-on écrire cette valeur sans détruire une information plus sûre ? */
function peutEcraser(l, champ, source){
  const actuelle = provenanceDe(l, champ);
  if (!l[champ] || !String(l[champ]).trim()) return true;      /* le champ est vide */
  if (!actuelle) return false;                                  /* origine inconnue : on n'y touche pas */
  return (RANG_PROVENANCE[source] || 0) > (RANG_PROVENANCE[actuelle.source] || 0);
}
function poserProvenance(l, champ, source){
  if (!l.provenance) l.provenance = {};
  l.provenance[champ] = { source:source, date:JOUR_COURANT };
}

/* ============================================================
   Les propositions. Ce que l'annuaire pourrait remplir, et rien d'autre.
   ============================================================ */
const CHAMPS_ANNUAIRE = [
  { cle:"secteur",     lbl:"Secteur d’activité", src:"secteur" },
  { cle:"effectif",    lbl:"Effectif",           src:"effectif", suffixe:" salariés" },
  { cle:"ville",       lbl:"Ville",              src:"ville" },
  { cle:"site",        lbl:"Site web",           src:"site" },
  { cle:"identifiant", lbl:"Identifiant légal",  src:"identifiant" },
  { cle:"telStandard", lbl:"Standard",           src:"tel" }
];

/** Renvoie la liste des champs que l'annuaire peut remplir sur cette fiche. */
function propositionsAnnuaire(l){
  const t = chercherSociete(l.societe, l.pays);
  if (!t) return { trouve:false, propositions:[] };
  const props = CHAMPS_ANNUAIRE.map(function(c){
    const val = t.fiche[c.src];
    if (val == null || val === "") return null;
    const affiche = String(val) + (c.suffixe || "");
    const dejaLa = l[c.cle] && String(l[c.cle]).trim() === affiche;
    return {
      cle:c.cle, lbl:c.lbl, valeur:affiche,
      actuelle:l[c.cle] || "",
      etat: dejaLa ? "identique" : (peutEcraser(l, c.cle, "annuaire") ? "proposable" : "protege")
    };
  }).filter(Boolean);
  return { trouve:true, fiche:t.fiche, score:t.score, propositions:props };
}

/** Applique UNE proposition. Jamais toutes d'un coup sans geste. */
function appliquerProposition(l, cle){
  const r = propositionsAnnuaire(l);
  const p = r.propositions.filter(function(x){ return x.cle === cle; })[0];
  if (!p || p.etat !== "proposable") return false;
  l[cle] = p.valeur;
  poserProvenance(l, cle, "annuaire");
  return true;
}

/* ============================================================
   La vérification d'adresse e-mail. Trois contrôles, tous locaux et
   tous explicables — pas de score opaque.
   ============================================================ */
const DOMAINES_JETABLES = ["exemple.com", "example.com", "test.com", "mailinator.com",
                           "yopmail.com", "jetable.org", "tempmail.com", "guerrillamail.com"];
const DOMAINES_GRAND_PUBLIC = ["gmail.com", "hotmail.com", "outlook.com", "yahoo.fr",
                               "yahoo.com", "free.fr", "orange.fr", "web.de", "gmx.de", "libero.it"];

function verifierEmail(l){
  const e = String(l.email || "").trim().toLowerCase();
  if (!e) return { etat:"vide", texte:"Aucune adresse. Sans elle, aucune relance ne peut partir." };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e))
    return { etat:"invalide", texte:"L’adresse n’a pas une forme valide." };
  const dom = e.split("@")[1];
  if (DOMAINES_JETABLES.indexOf(dom) >= 0)
    return { etat:"jetable", texte:"Domaine de test ou jetable : cette adresse ne recevra rien." };
  if (DOMAINES_GRAND_PUBLIC.indexOf(dom) >= 0)
    return { etat:"public", texte:"Adresse personnelle, pas professionnelle. Elle part avec la personne." };
  const t = chercherSociete(l.societe, l.pays);
  if (t && t.fiche.site && dom !== String(t.fiche.site).toLowerCase())
    return { etat:"discordant",
             texte:"Le domaine ne correspond pas à « " + t.fiche.site + " », domaine connu de la société." };
  return { etat:"ok", texte: t ? "Domaine cohérent avec la société." : "Forme valide." };
}

/* ============================================================
   Les doublons. Ils étaient COMPTÉS ; ils sont maintenant IDENTIFIÉS,
   par paires, avec la raison du rapprochement.
   ============================================================ */
function normTel(t){ return String(t || "").replace(/[^0-9]/g, "").replace(/^0+/, ""); }
function normMail(m){ return String(m || "").trim().toLowerCase(); }

/** Renvoie les paires réelles, avec la clé qui les a rapprochées. */
function pairesDoublons(rows){
  const paires = [];
  const vues = new Set();
  for (let i = 0; i < rows.length; i++) {
    for (let j = i + 1; j < rows.length; j++) {
      const a = rows[i], b = rows[j];
      let motif = null;
      if (normMail(a.email) && normMail(a.email) === normMail(b.email)) motif = "même adresse e-mail";
      else if (normTel(a.tel) && normTel(a.tel).length >= 8 && normTel(a.tel) === normTel(b.tel))
        motif = "même numéro de téléphone";
      else {
        const na = cleSociete(a.societe), nb = cleSociete(b.societe);
        const pa = (String(a.prenom||"") + " " + String(a.nom||"")).trim().toLowerCase();
        const pb = (String(b.prenom||"") + " " + String(b.nom||"")).trim().toLowerCase();
        if (na && na === nb && pa && jaroWinkler(pa, pb) >= 0.94)
          motif = "même personne dans la même société";
      }
      if (!motif) continue;
      const k = [a.id, b.id].sort().join("|");
      if (vues.has(k)) continue;
      vues.add(k);
      paires.push({ id:k, a:a, b:b, motif:motif });
    }
  }
  return paires;
}

/** Les champs qu'une fusion doit trancher. */
const CHAMPS_FUSION = [
  ["prenom","Prénom"], ["nom","Nom"], ["fonction","Fonction"], ["societe","Société"],
  ["email","Adresse e-mail"], ["tel","Téléphone"], ["pays","Pays"],
  ["secteur","Secteur"], ["ville","Ville"], ["site","Site web"], ["identifiant","Identifiant légal"]
];

/** Prépare la fusion : pour chaque champ, ce que porte A, ce que porte B,
 *  et lequel l'application recommande — sans jamais décider seule. */
function preparerFusion(a, b){
  return CHAMPS_FUSION.map(function(c){
    const va = a[c[0]] || "", vb = b[c[0]] || "";
    if (!va && !vb) return null;
    let conseil = "a";
    if (!va && vb) conseil = "b";
    else if (va && vb && va !== vb) {
      /* À valeurs différentes, la plus sûre gagne ; à provenance égale,
         la plus complète. */
      const ra = RANG_PROVENANCE[(provenanceDe(a, c[0]) || {}).source] || 0;
      const rb = RANG_PROVENANCE[(provenanceDe(b, c[0]) || {}).source] || 0;
      conseil = rb > ra ? "b" : (ra > rb ? "a" : (String(vb).length > String(va).length ? "b" : "a"));
    }
    return { cle:c[0], lbl:c[1], a:va, b:vb, identiques:(va === vb), conseil:conseil };
  }).filter(Boolean);
}

/* ============================================================
   L'ÉCRAN DE FUSION DES DOUBLONS.

   Le compteur annonçait un problème sans permettre de le trancher :
   c'est le pire des deux mondes. Ici chaque paire s'ouvre, chaque champ
   s'arbitre, et la fusion n'a lieu qu'après.

   L'application CONSEILLE une valeur, elle n'en impose aucune : deux
   fiches qui divergent sur un numéro de téléphone posent une question
   commerciale, pas une question technique.
   ============================================================ */

/** Les paires en attente, calculées sur le carnet entier. */
function paireEnCours(){
  const paires = pairesDoublons(carnetComplet());
  if (!S.fusion || !S.fusion.id) return { paires:paires, courante:null };
  const c = paires.filter(function(p){ return p.id === S.fusion.id; })[0];
  return { paires:paires, courante:c || null };
}

        'tranchez, champ par champ, avant toute fusion.</p>' +
    '</div>' +

    '<div class="kpigrid" style="margin-bottom:18px">' +
      kpi("Paires à trancher", paires.length, "sur l’ensemble du carnet", null) +
      kpi("Même adresse e-mail",
          paires.filter(function(p){ return p.motif === "même adresse e-mail"; }).length,

/** Le panneau d'arbitrage d'une paire. */
function panneauFusion(p){

          }
          return '<tr><td><span class="cellname">' + esc(c.lbl) + '</span>' +
            '<div class="cellsub">conseillé : fiche ' + c.conseil.toUpperCase() + '</div></td>' +
            ["a","b"].map(function(cote){
              const v = c[cote];

                (sel === cote ? 'aria-pressed="true" ' : "") +

/** Exécute la fusion selon les choix retenus. */
function fusionner(idPaire){
  const e = paireEnCours();
  const p = e.courante;
  if (!p || p.id !== idPaire) return false;

  const choix = (S.fusion && S.fusion.choix) || {};
  const lignes = preparerFusion(p.a, p.b);

  /* La fiche qui SURVIT est celle du salon en cours si l'une des deux en
     vient : c'est elle qui porte la qualification la plus fraîche. Une
     fiche d'historique n'est pas modifiable, on ne peut donc pas la
     garder comme survivante. */
  const aEstCourant = S.leads.some(function(x){ return x.id === p.a.id; });
  const bEstCourant = S.leads.some(function(x){ return x.id === p.b.id; });
  if (!aEstCourant && !bEstCourant) return false;

  /* p.a et p.b viennent de carnetComplet(), qui fabrique des COPIES pour
     unifier la forme des leads et de l historique. Ecrire dessus ne
     changeait rien : il faut retrouver le lead reel par son identifiant,
     sinon la fusion parait fonctionner et ne conserve aucune valeur. */
  const survivant = byId(S.leads, aEstCourant ? p.a.id : p.b.id);
  const source    = aEstCourant ? p.b : p.a;
  if (!survivant) return false;

  lignes.forEach(function(c){
    if (c.identiques) return;
    const cote = choix[c.cle] || c.conseil;
    const depuis = cote === "a" ? p.a : p.b;
    const val = cote === "a" ? c.a : c.b;
    if (!val) return;
    survivant[c.cle] = val;
    const pr = provenanceDe(depuis, c.cle);
    poserProvenance(survivant, c.cle, pr ? pr.source : "saisie");
  });

  if (source.date && (!survivant.date || source.date < survivant.date))
    survivant.date = source.date;
  survivant.fusionDe = (survivant.fusionDe || []).concat([source.id]);

  /* Seule une fiche du salon en cours peut être retirée : l'historique
     des éditions closes n'est pas réécrit. */
  /* Si la fiche absorbee vient du salon en cours, elle sort de S.leads.
     Si elle vient d une edition close, l historique n est pas reecrit :
     on la marque absorbee et le carnet cesse de la compter. */
  if (S.leads.some(function(x){ return x.id === source.id; }))
    S.leads = S.leads.filter(function(x){ return x.id !== source.id; });
  else
    S.absorbes = (S.absorbes || []).concat([source.id]);

  const d = scoreDetail(survivant);
  survivant.score = d.total; survivant.statut = statutDe(d.total);
  S.fusion = null;
  sauver();
  return true;
}

/* ============================================================
   LES MESURES — conforme à docs/MESURES.md

   Il n'y a plus de points, plus de rangs, plus de monnaie interne.
   On vend à des professionnels : la seule unité qui traverse le produit,
   du stand au comité de direction, est le LEAD QUALIFIÉ.

   La motivation ne disparaît pas pour autant — elle change de nature.
   « Cette capture vaut 0 point » devient « une capture ne compte pas
   dans le chiffre du jour ». Et au lieu d'annoncer un gain, on annonce
   une CONSÉQUENCE : « Chaud — devis dû le vendredi 19 juin, 12 h. »
   ============================================================ */

/* ---- le barème de qualification : conservé tel quel, ce n'est pas du jeu ---- */
const CONTRIB = {
  niveau:  { poids:30, r:{ "Projet budgété":1, "Appel d'offres en cours":.88, "Projet à l'étude":.6,
                           "Renouvellement parc":.47, "Veille technologique":.15 } },
  profil:  { poids:20, r:{ "Fabricant":1, "Utilisateur final":.9, "Intégrateur":.7,
                           "Bureau d'études":.6, "Distributeur":.5, "Négociant":.3 } },
  suivi:   { poids:20, r:{ "Devis sous 48 h":1, "Visite usine à planifier":.8,
                           "Transmettre à l'agent local":.5, "Envoi documentation":.4, "Rappel dans 3 mois":.2 } },
  origine: { poids:15, r:{ "Rendez-vous planifié":1, "Recommandation partenaire":.87,
                           "Contact agent local":.67, "Borne libre-service":.6,
                           "Conférence exposant":.53, "Passage sur stand":.4 } }
};
const SEUILS_BANDE = [60, 75];
const CRITERES_QUALIF = ["origine", "profil", "niveau", "suivi"];

/* ============================================================
   ANNEXE A — définition du lead qualifié, v1.
   Toute évolution crée une v2 : datée, publiée, jamais appliquée
   rétroactivement à une période déjà présentée en comité.
   ============================================================ */
function emailExploitable(l){
  return !!(l.email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(l.email).trim()));
}
/* Le seuil suit le curseur de l administrateur. Ecrit en dur, il faisait
   diverger la definition du lead qualifie de la bande Tiede affichee :
   on deplacait le seuil, les bandes bougeaient, le compte des qualifies
   restait accroche a 60. */
function seuilQualif(){
  return (typeof S !== "undefined" && S.scoring && S.scoring.seuils &&
          S.scoring.seuils.tiede != null) ? S.scoring.seuils.tiede : SEUILS_BANDE[0];
}
function qualifie(l){
  return emailExploitable(l)
      && CRITERES_QUALIF.every(function(k){ return l[k] && String(l[k]).trim(); })
      && (l.score || 0) >= seuilQualif()
      && l.consentement === true;
}
/** Prête pour le CRM : qualifiée ET complète sur les cinq champs. */
function pretCRM(l){ return qualifie(l) && completude(l) === 1; }

/** Définition v0, rétrospective : les éditions closes ne portent ni les
 *  critères ni le score. Seule condition vérifiable, et on l'étiquette. */
function qualifieV0(c){ return emailExploitable(c); }

function mediane(a){
  const v = a.filter(function(x){ return typeof x === "number" && isFinite(x); }).sort(function(x,y){ return x-y; });
  if (!v.length) return 0;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : Math.round((v[m-1] + v[m]) / 2);
}
function percentile(a, p){
  const v = a.filter(function(x){ return typeof x === "number" && isFinite(x); }).sort(function(x,y){ return x-y; });
  if (!v.length) return 0;
  return v[clamp(Math.ceil(v.length * p) - 1, 0, v.length - 1)];
}

/* ============================================================
   T7 — la réponse due. C'est ce qui remplace la ligne de valeur :
   une conséquence datée, pas un gain chiffré.
   ============================================================ */
const DELAI_BANDE = { "Chaud":2, "Tiède":5, "Froid":15 };   /* jours ouvrés */
const JOURS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS_FR  = ["janvier","février","mars","avril","mai","juin","juillet","août",
                  "septembre","octobre","novembre","décembre"];

function reponseDue(l){
  const base = new Date((l.date || "2026-06-17") + "T12:00:00");
  let reste = DELAI_BANDE[l.statut] != null ? DELAI_BANDE[l.statut] : 5;
  const d = new Date(base.getTime());
  while (reste > 0) {
    d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) reste--;   /* jours ouvrés */
  }
  return {
    date: d,
    texte: JOURS_FR[d.getDay()] + " " + d.getDate() + " " + MOIS_FR[d.getMonth()] + ", 12 h",
    action: l.suivi || "Reprise de contact"
  };
}

/* ============================================================
   Le chiffre du jour, côté commercial. Trois chiffres primaires,
   pas un de plus. Aucun euro, aucun coût n'atteint cet écran.
   ============================================================ */
const JOUR_COURANT = "2026-06-17";
const CONTACTS_ATTENDUS = 4;   /* dérivé : objectif de leads qualifiés / taux constaté */

function mesLeads(id, jour){
  return S.leads.filter(function(l){
    return l.commercial === id && (!jour || l.date === jour);
  });
}
function journee(id){
  const duJour = mesLeads(id, JOUR_COURANT);
  const q = duJour.filter(qualifie);
  const ages = S.pile.map(function(p){
    const m = String(p.capture || "").match(/(\d+)\s*(min|h)/);
    if (!m) return 0;
    return m[2] === "h" ? +m[1] * 60 : +m[1];
  });
  return {
    contacts: duJour.length,
    attendus: CONTACTS_ATTENDUS,
    qualifies: q.length,
    chauds: duJour.filter(function(l){ return (l.score || 0) >= 75; }).length,
    pretsCRM: duJour.filter(pretCRM).length,
    delaiMedian: mediane(duJour.map(function(l){ return l.qualifieEn; })),
    aQualifier: S.pile.length,
    plusAncienne: ages.length ? Math.max.apply(null, ages) : 0
  };
}
/** T11 — la meilleure journée, en contacts enregistrés. */
function meilleureJournee(id){
  const parJour = {};
  mesLeads(id).forEach(function(l){ parJour[l.date] = (parJour[l.date] || 0) + 1; });
  const v = Object.keys(parJour).map(function(k){ return parJour[k]; });
  return v.length ? Math.max.apply(null, v) : 0;
}
/** T10 — l'état de service : ce qu'un commercial peut citer en entretien annuel. */
function carnetPersonnel(id){
  const h = (SEED.historique || []).filter(function(x){ return x.commercial === id; });
  const c = byId(SEED.commerciaux, id);
  return {
    salons: (c && c.salonsFaits) ? c.salonsFaits : 0,
    contacts: h.length,
    opportunites: h.filter(function(x){ return x.opportunite; }).length,
    montant: h.reduce(function(s,x){ return s + (x.montant || 0); }, 0)
  };
}

/* ============================================================
   Ce qu'il manque — l'algorithme du delta minimal est inchangé.
   Seul le texte change : plus un mot de « point » de jeu, on parle
   d'écart à la bande.
   ============================================================ */
function gesteManquant(l){
  const S0 = typeof l.score === "number" ? l.score : scoreDetail(l).total;
  const seuil = SEUILS_BANDE.filter(function(s){ return s > S0; }).sort(function(a,b){ return a-b; })[0];
  if (!seuil) return null;
  const ecart = seuil - S0;

  const cand = [];
  Object.keys(CONTRIB).forEach(function(cle){
    const c = CONTRIB[cle];
    const actuel = c.r[l[cle]] != null ? c.r[l[cle]] : 0;
    Object.keys(c.r).forEach(function(v){
      const delta = Math.floor(c.poids * (c.r[v] - actuel));
      if (delta >= ecart) cand.push({ type:"champ", cle:cle, valeur:v, gain:delta, cout:1,
        texte:LBL_CRIT[cle] + " : « " + v + " »" });
    });
  });
  CHAMPS_COMPLETUDE.forEach(function(k){
    if (!l[k] || !String(l[k]).trim()) {
      if (3 >= ecart) cand.push({ type:"complet", cle:k, gain:3, cout:2,
        texte:"Renseigner " + LBL_COMPLET[k] });
    }
  });
  if (!cand.length) {
    return { multiple:true, ecart:ecart, seuil:seuil,
      texte:"À " + ecart + " points du niveau " + statutDe(seuil) + ". Plusieurs champs à renseigner." };
  }
  cand.sort(function(a,b){ return (a.gain - b.gain) || (a.cout - b.cout); });
  const g = cand[0];
  return {
    multiple:false, ecart:ecart, seuil:seuil, choix:g,
    texte:"À " + ecart + " points du niveau " + statutDe(seuil) + ". " + g.texte +
          " → " + (S0 + g.gain) + " / 100, " + statutDe(S0 + g.gain) + "."
  };
}
/* nom conservé pour les appels existants */
function pointManquant(l){ return gesteManquant(l); }

const LBL_CRIT = { niveau:"Niveau de demande", profil:"Profil société",
                   suivi:"Action de suivi", origine:"Origine du contact" };
const LBL_COMPLET = { email:"l'e-mail", tel:"le téléphone", fonction:"la fonction",
                      machine:"la machine", produit:"le produit" };

/* ============================================================
   Ce qui remplace les défis : le travail non fini, nommé et ventilé
   par cause. Chaque ligne ouvre la fiche sur le champ manquant.
   ============================================================ */
function aBoucler(id){
  const duJour = mesLeads(id, JOUR_COURANT);
  const sansEmail = duJour.filter(function(l){ return !emailExploitable(l); });
  const sousBande = duJour.filter(function(l){ return emailExploitable(l) && (l.score || 0) < 60; });
  const nonTransmis = duJour.filter(function(l){ return qualifie(l) && !l.crm; });
  return [
    { nom:"Cartes à qualifier", n:S.pile.length,
      aide:S.pile.length ? "Une carte non remplie ne compte pas dans le chiffre du jour." : "La liste est vide.",
      aller:"pile" },
    { nom:"Fiches sans e-mail exploitable", n:sansEmail.length,
      aide:"Sans e-mail, aucune relance ne peut partir : la fiche ne compte pas comme lead qualifié.",
      aller:"mesleads" },
    { nom:"Sous le niveau Tiède", n:sousBande.length,
      aide:"Un critère de plus fait souvent basculer la fiche.", aller:"mesleads" },
    { nom:"Qualifiées, pas encore transmises", n:nonTransmis.length,
      aide:"Objectif : zéro à la fermeture du stand.", aller:"mesleads" }
  ];
}

/* ============================================================
   La contribution de l'équipe.
   Tri ALPHABÉTIQUE, jamais par performance — un classement public
   démotive les trois quarts d'une équipe. La médiane sert de repère.
   ============================================================ */
function contributionEquipe(){
  const l = SEED.commerciaux.map(function(c){
    const mien = mesLeads(c.id);
    const q = mien.filter(qualifie);
    return {
      c:c, contacts:mien.length, qualifies:q.length,
      taux: pct(q.length, mien.length),
      pretsCRM: mien.filter(pretCRM).length,
      chauds: mien.filter(function(x){ return (x.score||0) >= 75; }).length,
      delai: mediane(mien.map(function(x){ return x.qualifieEn; })),
      carnet: carnetPersonnel(c.id)
    };
  });
  l.sort(function(a,b){ return a.c.nom.localeCompare(b.c.nom, "fr"); });
  const med = mediane(l.map(function(x){ return x.qualifies; }));
  return { lignes:l, medianeQualifies:med };
}

/* ============================================================
   Le pouls : ce que l'équipe vient de faire. Sans chiffre de gain.
   ============================================================ */
function pouls(n){
  return S.leads
    .filter(function(l){ return qualifie(l); })
    .slice(0, n || 6)
    .map(function(l, i){
      const c = byId(SEED.commerciaux, l.commercial);
      return {
        c:c, lead:l, quand:(i * 4 + 2) + " min",
        quoi: (l.score >= 75 ? "a qualifié un lead chaud chez " : "a qualifié un lead chez ") + l.societe
      };
    });
}

/* ------------------------------------------------------------
   Preservation du focus.

   render() remplace tout le contenu de #main : l element qui vient d etre
   active est detruit et le focus retombe sur <body>. Un utilisateur au
   clavier qui trie une colonne ou coche un lead repart alors du haut du
   document. On memorise donc une adresse stable de l element actif, et on
   le retrouve apres le rendu.
   ------------------------------------------------------------ */
const ATTRS_FOCUS = ["data-sort","data-f","data-ptab","data-check","data-me","data-req",
                     "data-up","data-down","data-view","data-role","data-pile","data-open",
                     "data-kpi-filtre","data-crm-go"];

function adresseFocus(){
  const a = document.activeElement;
  if (!a || a === document.body || !a.hasAttribute) return null;
  if (a.id) return "#" + (window.CSS && CSS.escape ? CSS.escape(a.id) : a.id);
  const parts = [];
  ATTRS_FOCUS.forEach(function(n){
    if (a.hasAttribute(n)) {
      const v = a.getAttribute(n);
      parts.push("[" + n + '="' + (window.CSS && CSS.escape ? CSS.escape(v) : v) + '"]');
    }
  });
  // data-q et data-v vont par paire : l un sans l autre designe plusieurs pastilles
  if (a.hasAttribute("data-q") && a.hasAttribute("data-v")) {
    parts.push('[data-q="' + CSS.escape(a.getAttribute("data-q")) + '"]');
    parts.push('[data-v="' + CSS.escape(a.getAttribute("data-v")) + '"]');
  }
  return parts.length ? parts.join("") : null;
}

function rendreEnGardantLeFocus(){
  const cle = adresseFocus();
  render();
  if (!cle) return;
  let n = null;
  try { n = document.querySelector(cle); } catch (e) { n = null; }
  if (n && typeof n.focus === "function") n.focus({ preventScroll:true });
}

/* ============================================================
   L echelle des appareils.

   L ecran de l appareil est rendu a sa resolution logique REELLE
   (402 x 874 pour l iPhone, 834 x 1194 pour l iPad) : l interface qu on
   regarde est donc exactement celle qui tournerait sur l appareil, au
   pixel pres. Ce qu on ajuste ici n est pas la mise en page, c est la
   distance : un seul facteur de reduction applique au tout.

   Le facteur ne depend que de la fenetre — jamais de la largeur de la
   colonne, qui est elle-meme dimensionnee par l appareil. Le mesurer sur
   le parent creerait une boucle et ferait osciller la mise en page.
   ============================================================ */
function poserEchelle(){
  const appareils = document.querySelectorAll(".appareil");
  if (!appareils.length) return;

  const zone = document.getElementById("main");
  const large = zone ? zone.clientWidth - 80 : window.innerWidth - 80;   /* 80 = marges de .page */
  /* En deux colonnes l appareil ne prend pas plus de 46 % de la zone :
     au-dela, le texte qui l accompagne devient illisible. En une seule
     colonne il peut occuper toute la largeur. */
  const budgetL = window.innerWidth <= 1180 ? large : large * 0.46;

  const rZone = zone ? zone.getBoundingClientRect() : { top:0 };

  appareils.forEach(function(env){
    const el = env.firstElementChild;
    if (!el) return;
    const L = el.classList.contains("tablette") ? 882 : 426;
    const H = el.classList.contains("tablette") ? 1242 : 898;
    /* La hauteur libre se mesure depuis la position de repos de l appareil,
       c est-a-dire son decalage DANS le contenu defilant — pas sa position
       a l ecran, qui bouge avec le defilement, ni le haut de la zone, qui
       ignore l en-tete de page place au-dessus. Ainsi mesuree, la valeur
       est stable et l appareil tient entier sans avoir a defiler. */
    const decalage = zone
      ? env.getBoundingClientRect().top - rZone.top + zone.scrollTop
      : 0;
    const budgetH = window.innerHeight - rZone.top - decalage - 24;
    /* Jamais d agrandissement : au-dela de 1 on inventerait un appareil
       qui n existe pas. Jamais sous 0,26 non plus : en dessous l ecran
       n est plus lisible et mieux vaut laisser la page defiler. */
    let k = Math.min(1, budgetH / H, budgetL / L);
    if (!isFinite(k) || k <= 0) k = 1;
    env.style.setProperty("--k", Math.max(k, 0.26).toFixed(4));
  });
}

/* La hauteur libre change avec la fenetre : l echelle aussi. */
(function suivreEchelle(){
  let t = null;
  window.addEventListener("resize", function(){
    if (t) cancelAnimationFrame(t);
    t = requestAnimationFrame(poserEchelle);
  });
})();

   1. Aucune donnée du bac à sable ne remonte sur cette page.

   ============================================================ */

/* ---------- écran : fiche de qualification ---------- */
function pFiche(){
  const p = S.pdraft;
  if (!p) return "";
  const bas = ["prenom","nom","fonction","societe","email","tel"].filter(function(k){ return p.conf[k] < .8; });
  const det = scoreDetail(p);
  const st = statutDe(det.total);

  const champ = function(k, lbl){
    const c = p.conf[k];
    return '<label class="cfield' + (c < .8 ? " low" : "") + '">' +
      '<span class="cl">' + esc(lbl) +
        (c < .8 ? '<span class="cflag">à vérifier · ' + Math.round(c*100) + ' %</span>' : "") + '</span>' +
      '<input type="text" value="' + esc(p[k] || "") + '" data-fld="' + k + '"></label>';
  };

  // Un champ configure par l administration, rendu tel qu il est configure.
  const groupe = function(ch) {
    const vals = VALEURS[ch.id] || [];
    if (!vals.length) return "";
    const choisies = ch.type === "multi"
      ? String(p[ch.id] || "").split(", ").filter(Boolean)
      : [p[ch.id]];
    return '<fieldset style="margin:14px 0 0;padding:0;border:0;min-width:0">' +
      '<legend style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4);margin-bottom:7px;padding:0">' +
        esc(ch.nom) +
        (ch.requis ? ' <span style="color:var(--verm-e)" title="Champ obligatoire">•</span>'
                   : ' <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-4)">(facultatif)</span>') +
        (ch.type === "multi" ? ' <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-4)">— plusieurs choix</span>' : "") +
      '</legend>' +
      '<div class="qchips">' + vals.map(function(v){
        const on = choisies.indexOf(v) >= 0;
        return '<button type="button" class="qchip" data-q="' + esc(ch.id) + '" data-v="' + esc(v) + '"' +
               ' data-multi="' + (ch.type === "multi" ? "1" : "0") + '"' +
               ' aria-pressed="' + (on ? "true" : "false") + '">' + esc(v) + '</button>';
      }).join("") + '</div></fieldset>';
  };

  return '<div class="psec">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
      '<button type="button" class="iconbtn" id="btn-back" aria-label="Retour à la liste À qualifier" style="transform:rotate(180deg)">' + ic("right",18) + '</button>' +
      '<div style="flex:1"><div style="font-size:16px;font-weight:600;letter-spacing:-.02em">Qualifier</div>' +
      '<div style="font-size:11px;color:var(--ink-3)">' + esc(p.capture) + '</div></div>' +
      '<span class="tag ' + statClass(st) + '"><span class="dot"></span>' + esc(st) + ' · ' + det.total + '</span>' +
    '</div>' +

    (bas.length
      ? '<div style="background:var(--warm-bg);border:1px solid var(--warm-line);padding:10px 12px;display:flex;gap:9px;align-items:flex-start;margin-bottom:12px">' +
        '<span style="color:var(--warm);flex:none;margin-top:1px">' + ic("alert",16) + '</span>' +
        '<p style="font-size:11.5px;color:var(--ink-2);line-height:1.5">' +
          '<b>' + bas.length + ' champ' + (bas.length>1?"s":"") + ' à vérifier.</b> ' +
          'La lecture est incertaine, ' + (bas.length>1?"ils sont remontés":"il est remonté") + ' en tête.</p></div>'
      : "") +

    '<div style="display:flex;flex-direction:column;gap:7px">' +
      bas.map(function(k){ return champ(k, LBL[k]); }).join("") +
      ["prenom","nom","fonction","societe","email","tel"].filter(function(k){ return bas.indexOf(k) < 0; })
        .map(function(k){ return champ(k, LBL[k]); }).join("") +
    '</div>' +

    '<div style="margin-top:14px">' +
      '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4);margin-bottom:7px">Note vocale</div>' +
      (p.note
        ? '<div class="pcard" style="background:var(--bg-2)"><div style="display:flex;gap:8px;align-items:flex-start">' +
          '<span style="color:var(--verm-e);flex:none;margin-top:1px">' + ic("mic",15) + '</span>' +
          '<p style="font-size:12.5px;color:var(--ink-2);line-height:1.55;flex:1">' + esc(p.note) + '</p></div>' +
          '<p style="font-size:10.5px;color:var(--ink-4);margin-top:8px">Transcription automatique · français · 11 s</p></div>'
        : '<button type="button" class="prow" id="btn-voice" style="justify-content:center;gap:8px;color:var(--verm-e);font-weight:600;font-size:13px">' +
          ic("mic",17) + 'Maintenir pour dicter</button>') +
    '</div>' +

    S.champs.map(groupe).join("") +

    '<div class="pcard" style="margin-top:16px;background:var(--bg-2)">' +
      '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4)">Pourquoi ce score</div>' +
      '<div style="margin-top:9px;display:flex;flex-direction:column;gap:6px">' +

        }).join("") +
      '</div>' +

      ic("check",20) + 'Enregistrer le lead</button>' +

      'La personne a été informée de la collecte au moment de la capture. Consentement horodaté et conservé.</p>' +

function qrSVG(q, taille){
  const n = q.n, cell = taille / n;
  let d = "";
  for (let y = 0; y < n; y++) {
    const row = q.rows[y];
    for (let x = 0; x < n; x++) {
      if (row[x] === "1") d += "M" + (x*cell) + " " + (y*cell) + "h" + cell + "v" + cell + "h" + (-cell) + "z";
    }
  }
  return '<svg class="qr" width="' + taille + '" height="' + taille + '" viewBox="0 0 ' + taille + ' ' + taille + '" ' +
    'role="img" aria-label="QR code de la carte de visite numérique, ' + esc(q.url) + '">' +
    '<rect width="' + taille + '" height="' + taille + '" fill="#fff"/>' +
    '<path d="' + d + '" fill="#0B0F19" shape-rendering="crispEdges"/></svg>';
}

/* ============================================================
   Le Dévoilement — la révélation du score, 800 ms.

   C'est le seul aléa authentique du produit : au moment de la capture,
   le commercial ne sait pas ce que vaut le contact. La qualification le
   révèle. La tension vient de la rétention de l'information et du rythme,
   jamais d'une latence simulée : le score est calculé en moins d'une
   milliseconde et aucun « analyse en cours » ne vient mentir dessus.

   Règle absolue : le compteur n'affiche JAMAIS une valeur supérieure au
   score final. Afficher 82 puis retomber à 61 détruirait la confiance
   dans le score, donc dans le produit, en une seule occurrence.
   ============================================================ */

const PASTILLES = { "Chaud":"●●●", "Tiède":"●●○", "Froid":"●○○" };

function pDevoilement(){
  const l = byId(S.leads, S.devoile);
  if (!l) return "";
  const due = reponseDue(l);
  const manque = pointManquant(l);
  const seuilProche = SEUILS_BANDE.filter(function(x){ return Math.abs(l.score - x) <= 3; })[0];

  return '<div class="psec" id="devoilement" style="padding-top:26px">' +

    '<div style="text-align:center">' +
      '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--f-texte-3)">' +
        esc(l.prenom + " " + l.nom) + ' · ' + esc(l.societe) + '</div>' +

      '<div style="position:relative;width:172px;height:172px;margin:18px auto 0">' +
        '<svg width="172" height="172" viewBox="0 0 172 172" aria-hidden="true">' +
          '<circle cx="86" cy="86" r="78" fill="none" stroke="var(--filet-fin)" stroke-width="9"/>' +
          '<circle id="dev-arc" cx="86" cy="86" r="78" fill="none" stroke="var(--encre)" stroke-width="9" ' +
            'stroke-linecap="round" stroke-dasharray="490.1" stroke-dashoffset="490.1" ' +
            'transform="rotate(-90 86 86)"/>' +
        '</svg>' +
        '<div style="position:absolute;inset:0;display:grid;place-items:center">' +
          '<div style="text-align:center">' +
            '<span class="acte" id="dev-acte">' +
              '<b id="dev-nombre" class="dev-score">0</b></span>' +
            '<span class="dev-sur" style="display:block;margin-top:6px">sur 100</span>' +
          '</div>' +
        '</div>' +
        /* Le marqueur de seuil reste affiché en permanence après le tirage. */
        (seuilProche ? '<div id="dev-seuil" style="position:absolute;left:50%;top:-4px;width:2px;height:16px;' +
          'background:var(--f-texte-3);opacity:0"><span style="position:absolute;top:-15px;left:50%;transform:translateX(-50%);' +
          'font-size:11px;color:var(--f-texte-3);font-variant-numeric:tabular-nums">' + seuilProche + '</span></div>' : "") +
      '</div>' +
